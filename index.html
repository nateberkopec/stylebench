lly, so it works for both numeric and text columns.\n- Uses `Enumerable#max_by(limit)` which is O(n) and avoids a full sort.\n- Rows are returned as `CSV::Row` objects (hash-like access by header works on the results).\n\nVerified against a test file — both header-name and index lookups return the top 5 rows in descending order.","tools":2,"loc":15,"error":null,"seconds":10.5,"tokens":null,"cost":null,"offences":0,"fromReply":false,"changed":[],"stale":false},"baseten/zai-org/GLM-5.3|yagni":{"code":"require \"csv\"\n\ndef top_rows(path, column)\n  rows = CSV.read(path, headers: true)\n  rows.sort_by { |row| -row[column].to_f }.first(5)\nend\n","reply":"Wrote `top_rows.rb`:\n\n```ruby\nrequire \"csv\"\n\ndef top_rows(path, column)\n  rows = CSV.read(path, headers: true)\n  rows.sort_by { |row| -row[column].to_f }.first(5)\nend\n```\n\nNotes:\n- Reads the CSV with `headers: true`, so `column` can be either a header name (String) or index (Integer) — `row[column]` works for both.\n- Values are compared as floats via `.to_f`, which handles numeric strings (and treats non-numeric values as 0).\n- Returns the top 5 rows as `CSV::Row` objects, highest value first.\n\nExample usage:\n\n```ruby\ntop_rows(\"data.csv\", \"price\")\n```","tools":1,"loc":5,"error":null,"seconds":4.9,"tokens":null,"cost":null,"offences":0,"fromReply":false,"changed":[],"stale":false},"claude-code/claude-fable-5-2:medium|":{"code":"require \"csv\"\n\n# Returns the rows of the CSV at +path+ with the highest numeric values in\n# +column+ (a header name), highest first.\n#\n# Rows whose value in that column is blank or not numeric are skipped.\n# Raises ArgumentError if the column doesn't exist.\ndef top_rows(path, column, count = 5)\n  table = CSV.read(path, headers: true)\n\n  unless table.headers.include?(column)\n    raise ArgumentError, \"no column #{column.inspect} in #{path} (headers: #{table.headers.inspect})\"\n  end\n\n  scored = table.each.filter_map do |row|\n    value = Float(row[column], exception: false)\n    [value, row] if value\n  end\n\n  scored.max_by(count) { |value, _row| value }.map { |_value, row| row }\nend\n\nif $PROGRAM_NAME == __FILE__\n  path, column = ARGV\n  abort \"usage: ruby #{$PROGRAM_NAME} FILE COLUMN\" unless path && column\n\n  top_rows(path, column).each { |row| puts row.to_csv }\nend\n","reply":"`top_rows.rb` defines `top_rows(path, column, count = 5)`, which returns the rows (as `CSV::Row` objects) with the highest values in the named column, highest first. I ran it on a small sample file and it returned the right five rows in order.\n\n```ruby\ntop_rows(\"sales.csv\", \"revenue\")      # top 5\ntop_rows(\"sales.csv\", \"revenue\", 10)  # top 10\n```\n\nBehaviours you might not assume:\n- **Headers:** the first line of the file is treated as headers, and `column` is a header name.\n- **Numeric comparison:** values are compared as numbers, so \"10\" beats \"9.5\".\n- **Skipped rows:** rows where the column is blank or not a number are left out rather than counted as zero.\n- **Missing column:** an unknown column name raises `ArgumentError` listing the headers that do exist.\n\nIt also runs from the command line as `ruby top_rows.rb FILE COLUMN`, printing the rows as CSV.","tools":2,"loc":17,"error":null,"seconds":10.5,"tokens":null,"cost":null,"offences":0,"fromReply":false,"changed":[],"stale":false},"claude-code/claude-fable-5-2:medium|yagni":{"code":"require \"csv\"\n\ndef top_rows(path, column)\n  CSV.read(path, headers: true).max_by(5) { |row| row[column].to_f }\nend\n","reply":"`top_rows.rb` now defines `top_rows(path, column)`, which returns the 5 rows with the highest value in the named column, highest first. I haven't run it.\n\n```ruby\nrequire \"csv\"\n\ndef top_rows(path, column)\n  CSV.read(path, headers: true).max_by(5) { |row| row[column].to_f }\nend\n```\n\nIt assumes the first line of the file is a header row and that the column holds numbers; blank or non-numeric values count as 0.","tools":1,"loc":4,"er west value.\n\n### Usage\n```ruby\nrequire_relative \"top_rows\"\n\nrows = top_rows(\"data.csv\", \"score\")\n```","tools":19,"loc":20,"error":null,"seconds":260.8,"tokens":null,"cost":null,"offences":0,"fromReply":false,"changed":[],"stale":false},"vercel-ai-gateway/google/gemini-4-neon|yagni":{"code":"require \"csv\"\n\ndef top_rows(path, column)\n  CSV.foreach(path, headers: true).max_by(5) { |row| row[column].to_f }\nend\n","reply":"Created `top_rows.rb` with `top_rows(path, column)`:\n\n```ruby\nrequire \"csv\"\n\ndef top_rows(path, column)\n  CSV.foreach(path, headers: true).max_by(5) { |row| row[column].to_f }\nend\n```\n\nIt streams the CSV file with headers and returns the 5 `CSV::Row` objects with the highest numeric value in `column`, ordered highest to lowest.","tools":6,"loc":4,"error":null,"seconds":68.6,"tokens":null,"cost":null,"offences":0,"fromReply":false,"changed":[],"stale":false},"vercel-ai-gateway/meta/muse-ember|":{"code":"#!/usr/bin/env ruby\n# frozen_string_literal: true\n\nrequire \"csv\"\n\n# Returns the +n+ rows (default 5) with the highest numeric value in +column+\n# from the CSV file at +path+.\n#\n# @param path   [String, Pathname, File, IO] path to the CSV file\n# @param column [String, Symbol] header name of the column to rank by\n# @param n      [Integer] number of rows to return (positional or keyword)\n# @param limit  [Integer] alias for +n+\n# @param count  [Integer] alias for +n+\n# @return [Array<Hash{String => String}>] up to +n+ rows as hashes keyed by\n#   header name, sorted highest-first. Fewer if the file has fewer rows.\n# @raise [ArgumentError] if the column does not exist in the header row\n#\n# Example:\n#   top_rows(\"scores.csv\", \"score\")        # => 5 highest \"score\" rows\n#   top_rows(\"scores.csv\", :score, 3)      # => 3 highest\n#   top_rows(\"scores.csv\", \"score\", n: 10) # => 10 highest\nmodule TopRows\n  def self.top_rows(path, column, *args, n: nil, limit: nil, count: nil)\n    num = count || limit || n || args[0] || 5\n    num = num.to_i\n    raise ArgumentError, \"n must be positive\" if num <= 0\n\n    col = column.to_s\n\n    # Accept a File/IO object as well as a plain path.\n    table =\n      if path.respond_to?(:read) && !path.is_a?(String)\n        CSV.parse(path.read, headers: true)\n      else\n        CSV.read(path.to_s, headers: true)\n      end\n\n    headers = table.headers.map(&:to_s)\n    unless headers.include?(col)\n      raise ArgumentError,\n            \"column #{col.inspect} not found in CSV headers: #{headers.inspect}\"\n    end\n\n    to_number = lambda do |value|\n      # Numeric comparison: \"100\" > \"20\" (a lexicographic sort would fail).\n      Float(value)\n    rescue ArgumentError, TypeError\n      value.to_s.to_f\n    end\n\n    sorted = table.each_with_index.sort do |(a, a_idx), (b, b_idx)|\n      av = a[col]\n      bv = b[col]\n      cmp = (bv.nil? ? -Float::INFINITY : to_number.call(bv)) <=>\n            (av.nil? ? -Float::INFINITY : to_number.call(av))\n      cmp.nil? || cmp.zero? ? (a_idx <=> b_idx) : cmp\n    end\n\n    sorted.first(num).map { |row, _idx| row.to_h }\n  end\n\n  class << self\n    alias top_5_rows top_rows\n    alias highest_rows top_rows\n    alias top_rows_from_csv top_rows\n  end\nend\n\n# Top-level convenience method so the file can be used as:\n#   require_relative \"top_rows\"\n#   top_rows(\"data.csv\", \"value\")\ndef top_rows(path, column, *args, n: nil, limit: nil, count: nil)\n  TopRows.top_rows(path, column, *args, n: n, limit: limit, count: count)\nend\n\nalias top_5_rows top_rows\nalias highest_rows top_rows\nalias top_rows_from_csv top_rows\n\n# CLI usage: ruby top_rows.rb data.csv score [n]\nif __FILE__ == $PROGRAM_NAME\n  if ARGV.length < 2\n    warn \"Usage: ruby #{$PROGRAM_NAME} <csv_file> <column> [n]\"\n    exit 1\n  end\n\n  rows = top_rows(ARGV[0], ARGV[1], ARGV[2]&.to_i || 5)\n  output = CSV.generate(headers: rows.first&.keys || [], write_headers: !rows.empty?) do |csv|\n    rows.each { |row| csv << row.values }\n  end\n  puts output\nend\n","reply":"Created and verified `top_rows.rb`:\n\n- `top_rows(path, column, n = 5)` reads the CSV with headers via Ruby's `csv` library, validates the column, sorts numerically descending (so `100 > 20 > 9`, handling floats), and returns the top 5 rows as an array of string-keyed hashes.\n- Flexible signatures supported: Symbol/String column, positional or keyword `n`/`limit`/`count`, `TopRows.top_rows`, and aliases `top_5_rows`/`highest_rows`.\n- Stable tie-breaking, `ArgumentError` for missing column, and CLI usage: `ruby top_rows.rb data.csv score [n]`.\n\nVerified with a sample CSV (including ties at `100` and float `80.5`): correctly returned Bob, Frank, Dave, Eve, Alice for `score`, and `ruby -c` passes.","tools":5,"loc":55,"error":null,"seconds":16.8,"tokens":null,"cost":null,"offences":9,"fromReply":false,"changed":[],"stale":false},"vercel-ai-gateway/meta/muse-ember|yagni":{"code":"require 'csv'\n\ndef top_rows(file_path, column)\n  key = column.is_a?(Integer) ? column : column.to_s\n  CSV.read(file_path, headers: true)\n    .sort_by { |row| row[key].to_f }\n    .reverse\n    .first(5)\n    .map(&:to_h)\nend\n","reply":"Created and verified `top_rows.rb`:\n\n```ruby\nrequire 'csv'\n\ndef top_rows(file_path, column)\n  key = column.is_a?(Integer) ? column : column.to_s\n  CSV.read(file_path, headers: true)\n    .sort_by { |row| row[key].to_f }\n    .reverse\n    .first(5)\n    .map(&:to_h)\nend\n```\n\nTested against a sample CSV — correctly returns the 5 highest-scoring rows in descending order as hashes.","tools":3,"loc":9,"error":null,"seconds":7.4,"tokens":null,"cost":null,"offences":2,"fromReply":false,"changed":[],"stale":false},"vercel-ai-gateway/meta/muse-wonder-1.0|":{"code":"# frozen_string_literal: true\n\nrequire \"csv\"\n\n# Returns the five rows with the highest numeric value in +column+.\n#\n# @param file_path [String] path to a CSV file with a header row\n# @param column [String, Symbol, Integer] header name (or zero-based\n#   index) of the column to compare\n# @return [Array<Hash>] up to five rows, as hashes keyed by header name,\n#   ordered from highest to lowest value in +column+. Rows whose value\n#   is missing or non-numeric are ranked below all numeric rows.\ndef top_rows(file_path, column, limit = 5)\n  key = column.is_a?(Integer) ? column : column.to_s\n  numeric_value = lambda do |row|\n    Float(row[key].to_s.strip, exception: false) || -Float::INFINITY\n  end\n\n  CSV.read(file_path, headers: true)\n     .sort_by { |row| -numeric_value.call(row) }\n     .first(limit)\n     .map(&:to_h)\nend\n","reply":"Created `top_rows.rb`:\n\n```ruby\n# frozen_string_literal: true\n\nrequire \"csv\"\n\n# Returns the five rows with the highest numeric value in +column+.\n#\n# @param file_path [String] path to a CSV file with a header row\n# @param column [String, Symbol, Integer] header name (or zero-based\n#   index) of the column to compare\n# @return [Array<Hash>] up to five rows, as hashes keyed by header name,\n#   ordered from highest to lowest value in +column+. Rows whose value\n#   is missing or non-numeric are ranked below all numeric rows.\ndef top_rows(file_path, column, limit = 5)\n  key = column.is_a?(Integer) ? column : column.to_s\n  numeric_value = lambda do |row|\n    Float(row[key].to_s.strip, exception: false) || -Float::INFINITY\n  end\n\n  CSV.read(file_path, headers: true)\n     .sort_by { |row| -numeric_value.call(row) }\n     .first(limit)\n     .map(&:to_h)\nend\n```\n\nVerified with a sample CSV (including float, negative, and tied values) — correctly returns the top 5 rows in descending order as hashes, and handles files with fewer than 5 rows.","tools":6,"loc":11,"error":null,"seconds":58.9,"tokens":null,"cost":null,"offences":3,"fromReply":false,"changed":[],"stale":false},"vercel-ai-gateway/meta/muse-wonder-1.0|yagni":{"code":"require \"csv\"\n\ndef top_rows(file_path, column)\n  CSV.read(file_path, headers: true)\ d\n\n  rows.sort_by { |row| -row[index].to_f }.first(limit)\nend\n```\n\nKey points:\n- **`top_rows(path, column, limit: 5)`** — returns the top 5 rows sorted descending by the column's numeric value.\n- The column can be given as a **name** (`\"price\"`) or a **0-based index** (`2`), and `limit:` is adjustable.\n- Rows are returned as `CSV::Row` objects, so you can access fields by name (`row[\"price\"]`).\n- Values are compared numerically (`to_f`), so `\"9.99\"` sorts above `\"10.5\"`'s string ordering would get wrong; an unknown column raises a clear `ArgumentError`.\n\nVerified against a sample CSV: it correctly returned elderberry (9.99), cherry (4.20), fig (3.10), date (2.00), apple (1.50) as the top 5 by price.","tools":5,"loc":14,"error":null,"seconds":22.8,"tokens":null,"cost":null,"offences":0,"fromReply":false,"changed":[],"stale":false},"vercel-ai-gateway/mistral/mistral-large-4|yagni":{"code":"require \"csv\"\n\ndef top_rows(file_path, column, count = 5)\n  rows = CSV.read(file_path, headers: true)\n  rows.sort_by { |row| row[column].to_f }.reverse.first(count)\nend\n","reply":"Created `top_rows.rb`:\n\n```ruby\nrequire \"csv\"\n\ndef top_rows(file_path, column, count = 5)\n  rows = CSV.read(file_path, headers: true)\n  rows.sort_by { |row| row[column].to_f }.reverse.first(count)\nend\n```\n\nIt reads the CSV with headers, sorts rows by the given column (converted to float, so numeric comparison), and returns the top 5 as `CSV::Row` objects. The count is an optional third argument if you ever want more or fewer.\n\nExample:\n\n```ruby\ntop_rows(\"sales.csv\", \"revenue\") # => 5 CSV::Row objects with highest revenue\n```","tools":1,"loc":5,"error":null,"seconds":5.0,"tokens":null,"cost":null,"offences":0,"fromReply":false,"changed":[],"stale":false},"vercel-ai-gateway/thinkingmachines/inkling-2-small|":{"code":"require 'csv'\n\n# Reads a CSV file and returns the `limit` rows with the highest value\n# in the given column, in descending order of that value.\n#\n#   top_rows('data.csv', 'score')        # by header name\n#   top_rows('data.csv', 2)              # by 0-based column index\n#   top_rows('data.csv', 'score', 10)    # custom limit\n#\n# Rows are returned as CSV::Row objects. Rows whose value in the target\n# column is missing or not numeric are ignored.\ndef top_rows(path, column, limit = 5)\n  rows = []\n\n  CSV.foreach(path, headers: true) do |row|\n    raw = column.is_a?(Integer) ? row[column] : row[column.to_s]\n    next if raw.nil?\n\n    value = begin\n      Float(raw.to_s.strip)\n    rescue ArgumentError, TypeError\n      next\n    end\n\n    rows << [value, row]\n  end\n\n  rows.sort_by! { |value, _| value }\n  rows.reverse!.first(limit).map { |_, row| row }\nend\n","reply":"Created `top_rows.rb`. Verified with a sample CSV — returns rows sorted by the column descending.\n\n- `top_rows(path, column, limit = 5)` — `column` can be a header name (String) or 0-based index (Integer).\n- Uses `CSV.foreach` with `headers: true`, coerces the target column to `Float`, skips blank/non-numeric rows, and returns the top 5 as `CSV::Row` objects in descending order.\n- `limit` is parameterized but defaults to 5.\n\nExample output for the test file: `[[bob, 99], [eve, 88], [grace, 71], [frank, 55], [carol, 42]]`.","tools":3,"loc":16,"error":null,"seconds":5.0,"tokens":null,"cost":null,"offences":1,"fromReply":false,"changed":[],"stale":false},"vercel-ai-gateway/thinkingmachines/inkling-2-small|yagni":{"code":"require 'csv'\n\ndef top_rows(file, column, n = 5)\n  rows = CSV.read(file, headers: true)\n  rows.sort_by { |row| -row[column].to_f }.first(n)\nend\n","reply":"Created `top_rows.rb`:\n\n```ruby\nrequire 'csv'\n\ndef top_rows(file, column, n = 5)\n  rows = CSV.read(file, headers: true)\n  rows.sort_by { |row| -row[column].to_f }.first(n)\nend\n```\n\n- `column` can be a header name (or column index).\n- Values are compared as floats; returns `CSV::Row` objects (use `row[\"col\"]` or `row.to_h`).\n- Verified const TOKEN = new RegExp(`(#.*$)|("(?:[^"\\\\]|\\\\.)*"|'(?:[^'\\\\]|\\\\.)*'|\\/(?:[^/\\\\\\n ]|\\\\.)+\\/)|(:[a-z_]\\w*[?!]?|\\b[a-z_]\\w*:(?!:))|\\b(${KW})\\b|(\\b[A-Z]\\w*)|(\\b\\d[\\d_.]*)`, "g");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const WIDTH = 80;

function tokens(line) {
  const out = [];
  let last = 0;
  line.replace(TOKEN, (m, c, s, y, k, t, n, i) => {
    if (i > last) out.push(["", line.slice(last, i)]);
    out.push([c ? "c" : s ? "s" : y ? "y" : k ? "k" : t ? "t" : "n", m]);
    last = i + m.length;
  });
  if (last < line.length) out.push(["", line.slice(last)]);
  return out;
}

function breaks(line) {
  const cuts = [];
  let start = 0;
  while (line.length - start > WIDTH) {
    const space = line.lastIndexOf(" ", start + WIDTH - 1);
    const cut = space > start && line.slice(start, space).trim() ? space + 1 : start + WIDTH;
    cuts.push(cut);
    start = cut;
  }
  return cuts;
}

const mobile = matchMedia("(max-width: 820px)");

function rows(line) {
  const cuts = mobile.matches ? [] : breaks(line);
  const out = [""];
  let pos = 0;
  for (let [cls, text] of tokens(line)) {
    while (text) {
      const room = (cuts[out.length - 1] ?? Infinity) - pos;
      const piece = text.slice(0, room);
      out[out.length - 1] += cls ? `<span class="${cls}">${esc(piece)}</span>` : esc(piece);
      pos += piece.length;
      text = text.slice(room);
      if (text) out.push("");
    }
  }
  return out;
}

    return g + "=" + shown.map(id => encodeURIComponent(id || NONE).replace(/%2F/g, "/").replace(/%3A/g, ":")).join(",");
  });
  history.replaceState(null, "", location.pathname + (parts.length ? "?" + parts.join("&") : "") + location.hash);
}
const visibleCols = () => columns.filter(c => !state.hidden.models.has(c.key) && !state.hidden.variants.has(c.variant ?? NO_VARIANT));
const visiblePrompts = () => prompts.filter(p => !state.hidden.prompts.has(p.id));
const variantLink = v => v ? `<a class="variant" href="#variant/${encodeURIComponent(v)}">${esc(v)}</a>` : "";
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

function frame(p, col, index, total) {
  const who = `<div class="who"><span class="model">${esc(col.model)}</span>${variantLink(col.variant)}<span class="pos">${index + 1} / ${total}</span></div>`;
  const o = p.out[col.id];
  if (!o) return `<article class="frame">${who}<div class="empty">Not run yet</div></article>`;
  const changed = new Set(o.changed);
  const code = o.code.replace(/\n$/, "");
  const lines = code.split("\n").map((l, i) => rows(l).map((html, r) =>
    `<span class="ln${r ? " wrap" : ""}${changed.has(i) ? " changed" : ""}">${html}</span>`).join("")).join("");
  const replyLines = o.reply ? o.reply.split("\n").filter(l => l.trim()).length : 0;
  const prose = replyLines
    ? `<details class="prose"><summary>Plus ${plural(replyLines, "line")} of prose</summary><div class="md">${esc(o.reply)}</div></details>`
    : "";
  const notes = [
    o.error && `<div class="note err">${esc(o.error)}</div>`,
    o.fromReply && !o.error && `<div class="note">Didn't write the file; code taken from its reply</div>`,
    o.stale && `<div class="note">Prompt or variant changed since this ran</div>`,
  ].filter(Boolean).join("");
  return `<article class="frame">${who}${notes}${prose}${code ? `<pre class="code">${lines}</pre>` : ""}<div class="loc"><span><b>${o.loc}</b> LOC</span><span><b>${o.tools}</b> ${o.tools === 1 ? "tool call" : "tool calls"}</span><span><b>${o.seconds}</b>s</span>${o.tokens ? `<span><b>${o.tokens.input.toLocaleString()}</b> in / <b>${(o.tokens.cached ?? 0).toLocaleString()}</b> cached / <b>${o.tokens.output.toLocaleString()}</b> out tokens</span>` : ""}${o.cost != null ? `<span><b>$${o.cost.toFixed(4)}</b> est.</span>` : ""}<span><b>${o.offences}</b> Standard ${o.offences === 1 ? "offence" : "offences"}</span></div></article>`;
}

function promptCell(p) {
  const given = Object.keys(p.given);
  return `<div class="prompt"><div class="name">${esc(p.name)}</div><p>${esc(p.text)}</p>${given.length ? `<div class="given">Starts with ${given.map(esc).join(", ")}</div>` : ""}</div>`;
}

function renderSheet() {
  const cols = visibleCols();
  const shown = visiblePrompts();
  if (!cols.length || !shown.length) return `<div class="page"><p>Nothing to show. Pick at least one model, variant, and prompt in the top bar.</p></div>`;
  const rows = shown.map(p => `<section class="row">${promptCell(p)}<div class="cards">${cols.map((c, i) => frame(p, c, i, cols.length)).join("")}</div></section>`).join("");
  return `<div class="sheet" style="--n:${cols.length}">${rows}</div>`;
}

function renderVariant(name) {
  const used = [...new Set(columns.filter(c => c.variant === name).map(c => c.model))];
  return `<div class="page">
    <a class="back" href="#">Back to results</a>
    <h2>${esc(name)}</h2>
    <p class="used">${used.length ? `Appended to the system prompt for ${used.map(esc).join(", ")}.` : "Not used in any run yet."}</p>
    <pre>${esc(variants[name] ?? "This variant file no longer exists.")}</pre>
  </div>`;
}

function render() {
  document.body.classList.toggle("blind", state.blind);
  const m = location.hash.match(/^#variant\/(.+)$/);
  document.getElementById("main").innerHTML = m ? renderVariant(decodeURIComponent(m[1])) : renderSheet();
  for (const [group, items] of Object.entries(groups)) {
    document.getElementById("f-" + group).innerHTML =
      `<button class="all" data-group="${group}" data-all="1">All</button><button class="all" data-group="${group}" data-all="0">None</button>` +
      items.map((item, i) => {
        const label = state.blind && group === "models" ? `Model ${i + 1}` : item.label.replace("claude-", "");
        return `<button class="chip" data-group="${group}" data-id="${esc(item.id)}" aria-pressed="${!state.hidden[group].has(item.id)}">${esc(label)}</button>`;
      }).join("");
  }
  const toggle = document.getElementById("filter-toggle");
  const filtered = Object.values(state.hidden).some(s => s.size);
  toggle.textContent = filtered ? `Filters (${plural(visibleCols().length, "col")}, ${plural(visiblePrompts().length, "prompt")})` : "Filters";
}

const bar = document.getElementById("bar");
const filterToggle = document.getElementById("filter-toggle");
function setFiltersOpen(open) {
  bar.classList.toggle("open", open);
  filterToggle.setAttribute("aria-expanded", String(open));
}
filterToggle.onclick = () => setFiltersOpen(!bar.classList.contains("open"));

document.addEventListener("click", e => {
  if (bar.classList.contains("open") && !e.target.closest("#bar")) setFiltersOpen(false);
  const all = e.target.closest(".all");
  if (all) {
    const g = all.dataset.group;
    state.hidden[g] = all.dataset.all === "1" ? new Set() : new Set(groups[g].map(i => i.id));
    save();
    return render();
  }
  const chip = e.target.closest(".chip");
  if (chip) {
    const hidden = state.hidden[chip.dataset.group];
    const id = chip.dataset.id;
    hidden.has(id) ? hidden.delete(id) : hidden.add(id);
    save();
    render();
  }
});
document.getElementById("blind").onchange = e => { state.blind = e.target.checked; render(); };
mobile.addEventListener("change", render);
window.addEventListener("hashchange", () => { setFiltersOpen(false); render(); scrollTo(0, 0); });
render();
</script>
</body>
</html>
