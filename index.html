headers, body]\n  end\nend\n\nRequestID = RequestId\n","reply":"Created `request_id.rb`:\n\n- `RequestId` Rack middleware wraps an app and passes through status/body unchanged.\n- Adds `X-Request-Id` to every response, propagating an incoming `HTTP_X_REQUEST_ID` when present and otherwise generating a `SecureRandom.uuid`.\n- Verified with `ruby -c` and a quick inline Rack app call.","tools":3,"loc":12,"error":null,"seconds":16.8,"tokens":null,"cost":null,"offences":0,"fromReply":false,"changed":[],"stale":false},"vercel-ai-gateway/mistral/mistral-large-4|":{"code":"require \"securerandom\"\n\n# Rack middleware that adds an X-Request-Id header to every response.\n#\n# Usage:\n#   use RequestId\n#   run MyApp\n#\n# If the incoming request already carries an X-Request-Id header, that value\n# is reused; otherwise a new UUID is generated.\nclass RequestId\n  HEADER = \"X-Request-Id\".freeze\n  HTTP_HEADER = \"HTTP_X_REQUEST_ID\".freeze\n\n  def initialize(app)\n    @app = app\n  end\n\n  def call(env)\n    request_id = env[HTTP_HEADER] || SecureRandom.uuid\n\n    status, headers, body = @app.call(env)\n\n    headers = headers.dup\n    headers[HEADER] = request_id\n\n    [status, headers, body]\n  end\nend\n","reply":"Done. `request_id.rb` contains a `RequestId` Rack middleware:\n\n- Generates a UUID via `SecureRandom.uuid` for each response and sets it as `X-Request-Id`\n- Reuses the incoming `X-Request-Id` if the client sent one (useful for tracing across services)\n- Duplicates the headers hash before writing, so the app's original headers object isn't mutated\n\nUsage:\n\n```ruby\nuse RequestId\nrun MyApp\n```\n\nVerified with a smoke test: new requests get a fresh UUID, incoming IDs pass through, and the upstream headers hash stays untouched.","tools":2,"loc":15,"error":null,"seconds":12.7,"tokens":null,"cost":null,"offences":0,"fromReply":false,"changed":[],"stale":false},"vercel-ai-gateway/mistral/mistral-large-4|yagni":{"code":"require \"securerandom\"\n\nclass RequestId\n  def initialize(app)\n    @app = app\n  end\n\n  def call(env)\n    status, headers, body = @app.call(env)\n    headers[\"X-Request-Id\"] ||= env[\"HTTP_X_REQUEST_ID\"] || generate_id\n    [status, headers, body]\n  end\n\n  private\n\n  def generate_id\n    SecureRandom.uuid\n  end\nend\n","reply":"Done. `request_id.rb` contains a `RequestId` Rack middleware:\n\n- Wraps the app, calls it, then sets `X-Request-Id` on the response headers.\n- Reuses an incoming `X-Request-Id` from the client if present (via `||=`), otherwise generates a UUID with `SecureRandom`.\n\nUsage: `use RequestId` in a `config.ru`.","tools":2,"loc":15,"error":null,"seconds":6.7,"tokens":null,"cost":null,"offences":0,"fromReply":false,"changed":[],"stale":false},"vercel-ai-gateway/thinkingmachines/inkling-2-small|":{"code":"# frozen_string_literal: true\n\nrequire \"securerandom\"\n\n# Rack middleware that adds an X-Request-Id header to every response.\n#\n# If the incoming request already carries an X-Request-Id header, that value\n# is reused; otherwise a new UUID is generated. The id is exposed to the app\n# via env[\"HTTP_X_REQUEST_ID\"] and echoed back on the response.\nclass RequestId\n  HEADER = \"X-Request-Id\"\n  ENV_KEY = \"HTTP_X_REQUEST_ID\"\n\n  def initialize(app)\n    @app = app\n  end\n\n  def call(env)\n    request_id = env[ENV_KEY].to_s.strip\n    request_id = SecureRandom.uuid if request_id.empty?\n    env[ENV_KEY] = request_id\n\n    status, headers, body = @app.call(env)\n\n    headers[HEADER] = request_id\n\n    [status, headers, body]\n  end\nend\n","reply":"Done — `request_id.rb` contains a `RequestId` Rack middleware. Verified working with a plain mock app (Rack isn't installed here, but the middleware only relies on the Rack interface).\n\nBehavior:\n- Reuses incoming `X-Request-Id` header if present, otherwise generates a `SecureRandom.uuid`\n- Sets `X-Request-Id` on the response headers\n- Exposes the id to the app via `env[\"HTTP_X_REQUEST_ID\"]`\n\nUsage:\n\n```ruby\nuse RequestId\n```\n\nOne note: Rack 3 prefers lowercase header names (`x-request-id`); I used the conventional `X-Request-Id` since that's what you asked for — easy to change if you're targeting strict Rack 3 lint compliance.","tools":5,"loc":16,"error":null,"seconds":8.8,"tokens":null,"cost":null,"offences":0,"fromReply":false,"changed":[],"stale":false},"vercel-ai-gateway/thinkingmachines/inkling-2-small|yagni":{"code":"require 'securerandom'\n\nclass RequestId\n  HEADER = 'X-Request-Id'\n\n  def initialize(app)\n    @app = app\n  end\n\n  def call(env)\n    request_id = env['HTTP_X_REQUEST_ID'] || SecureRandom.uuid\n    status, headers, body = @app.call(env)\n    headers[HEADER] = request_id\n    [status, headers, body]\n  end\nend\n","reply":"Created `request_id.rb`. Verified it works:\n\n- Generates a UUID X-Request-Id when the request has none\n- Propagates an incoming `X-Request-Id` header if present\n\nUsage:\n\n```ruby\nuse RequestId\n```\n\nOne note: if you're on Rack 3, response header names must be lowercase (`x-request-id`) per the SPEC — let me know and I'll adjust.","tools":3,"loc":13,"error":null,"seconds":6.1,"tokens":null,"cost":null,"offences":3,"fromReply":false,"changed":[],"stale":false}}},{"id":"retry","name":"Retry with backoff","text":"Write a Ruby helper that retries a block a few times with exponential backoff.","given":{},"out":{"baseten/deepseek-ai/DeepSeek-V4.1-Flash-1017:max|":{"code":"# frozen_string_literal: true\n\n# Retry a block with exponential backoff.\n#\n#   Retry.with_backoff(max_attempts: 5) { flaky_call }\n#\n#   Retry.with_backoff(max_attempts: 4, base_delay: 0.5, max_delay: 8,\n#                      retry_on: [Net::ReadTimeout, Errno::ECONNRESET]) do\n#     client.fetch\n#   end\n#\n# The block is called up to +max_attempts+ times total (the first call plus\n# retries). The delay before retry number +n+ (1-based) is:\n#\n#   min(base_delay * 2**(n - 1), max_delay)\n#\n# plus or minus jitter, so that many clients failing at once don't retry in\n# lockstep.\n#\n# Exceptions not covered by +retry_on+ are raised immediately. When attempts\n# run out, the last exception is re-raised (with its backtrace preserved).\nmodule Retry\n  DEFAULT_RETRY_ON = [StandardError].freeze\n\n  module_function\n\n  def with_backoff(max_attempts: 3, base_delay: 0.1, max_delay: 5.0,\n                   jitter: 0.1, retry_on: DEFAULT_RETRY_ON, on_retry: nil)\n    raise ArgumentError, \"max_attempts must be >= 1\" if max_attempts < 1\n\n    attempt = 0\n\n    begin\n      attempt += 1\n      yield attempt\n    rescue *retry_on => e\n      raise if attempt >= max_attempts\n\n      delay = backoff_delay(attempt, base_delay: base_delay, max_delay: max_delay, jitter: jitter)\n      on_retry&.call(e, attempt, delay)\n      sleep(delay)\n      retry\n    end\n  end\n\n  # Delay in seconds after the given failed attempt (1-based).\n  def backoff_delay(attempt, base_delay: 0.1, max_delay: 5.0, jitter: 0.1)\n    delay = [base_delay * (2**(attempt - 1)), max_delay].min\n    return delay if jitter.zero?\n\n    # Jitter is symmetric: +/- jitter fraction of the delay.\n    delay * (1 + (rand * 2 - 1) * jitter)\n  end\nend\n","reply":"Created `retry.rb` with a `Retry.with_backoff` helper. Verified with a throwaway test script (success path, exhaustion re-raise, non-retried exceptions, `on_retry` hook, delay math, jitter bounds, bad args) — all passed.\n\n```ruby\nRetry.with_backoff(max_attempts: 5) { flaky_call }\n\nRetry.with_backoff(max_attempts: 4, base_delay: 0.5, max_delay: 8, jitter: 0.1,\n                   retry_on: [Net::ReadTimeout, Errno::ECONNRESET],\n                   on_retry: ->(err, attempt, delay) { log(err, attempt, delay) }) do\n  client.fetch\nend\n```\n\nBehavior:\n- `max_attempts` counts the first call plus retries.\n- Delay before retry *n* is `min(base_delay * 2**(n-1), max_delay)`, ± `jitter` (fraction, default ±10%) so clients don't retry in lockstep.\n- Only `retry_on` exceptions retry (default `StandardError`); others propagate immediately.\n- On exhaustion the last exception is re-raised with its backtrace intact.\n- Block optionally receives the attempt number; `Retry.backoff_delay` is public if you want the delay schedule elsewhere.","tools":5,"loc":24,"error":null,"seconds":63.8,"tokens":null,"cost":null,"offences":1,"fromReply":false,"changed":[],"stale":false},"baseten/deepseek-ai/DeepSeek-V4.1-Flash-1017:max|yagni":{"code":"module Retry\n  def self.with_backoff(attempts: 3, base: 0.1, exceptions: StandardError)\n    tries = 0\n    begin\n      yield\n    rescue *exceptions\n      tries += 1\n      raise if tries >= attempts\n\n      sleep(base * 2**(tries - 1))\n      retry\n    end\n  end\nend\n","reply":"Created `retry.rb`:\n\n```ruby\nmodule Retry\n  def self.with_backoff(attempts: 3, base: 0.1, exceptions: StandardError)\n    tries = 0\n    begin\n      yield\n    rescue *exceptions\n      tries += 1\n      raise if tries >= attempts\n\n      sleep(base * 2**(tries - 1))\n      retry\n    end\n  end\nend\n```\n\nUsage:\n\n```ruby\nRetry.with_backoff { api.fetch }\nRetry.with_backoff(attempts: 5, base: 0.5, exceptions: [Net::ReadTimeout]) { api.fetch }\n```\n\nDelays are `base`, `base*2`, `base*4`, … and it re-raises the original exception once retries are exhausted. Verified: a block failing twice then succeeding returns on the 3rd try, and persistent failures raise after `attempts` tries.","tools":3,"loc":13,"error":null,"seconds":12.0,"tokens":null,"cost":null,"offences":0,"fromReply":false,"changed":[],"stale":false},"baseten/moonshotai/Kimi-K3.1-Pro|":{"code":"# Runs the block, retrying failures with delays of base_delay, 2 * base_delay,\n# 4 * base_delay, and so on. Returns the block's value on success and re-raises\n# the last exception when max_attempts is exhausted.\ndef with_retries(max_attempts: 3, base_delay: 0.1, retry_on: StandardError)\n  raise ArgumentError, \"a block is required\" unless block_given?\n  raise ArgumentError, \"max_attempts must be a positive integer\" unless max_attempts.is_a?(Integer) && max_attempts.positive?\n  raise ArgumentError, \"base_delay must be non-negative\" unless base_delay.is_a?(Numeric) && base_delay >= 0\n\n  attempt = 0\n\n  begin\n    attempt += 1\n    yield\n  rescue *Array(retry_on)\n    raise if attempt >= max_attempts\n\n    sleep(base_delay * (2**(attempt - 1)))\n    retry\n  end\nend\n","reply":"Created `retry.rb` with a `with_retries` helper featuring exponential backoff, configurable attempts/delays, and selectable retryable exceptions.\n\n```ruby\nresult = with_retries(max_attempts: 3, base_delay: 0.1) do\n  perform_operation\nend\n```\n\nIt returns the block’s result on success and re-raises the last exception after exhausting attempts. Syntax and behavior checks passed.","tools":3,"loc":14,"error":null,"seconds":17.7,"tokens":null,"cost":null,"offences":0,"fromReply":false,"changed":[],"stale":false},"baseten/moonshotai/Kimi-K3.1-Pro|yagni":{"code":"def with_retries(retries: 3, delay: 0.1)\n  yield\nrescue StandardError\n  raise unless retries.positive?\n\n  retries -= 1\n  sleep(delay)\n  delay *= 2\n  retry\nend\n","reply":"Created `retry.rb` with:\n\n```ruby\nwith_retries(retries: 3, delay: 0.1) { ... }\n```\n\nIt retries failed blocks with doubling delays and re-raises the last error after retries are exhausted. Ruby syntax verified.","tools":3,"loc":9,"error":null,"seconds":22.2,"tokens":null,"cost":null,"offences":1,"fromReply":false,"changed":[],"stale":false},"baseten/zai-org/GLM-5.3|":{"code":"# retry.rb\n#\n# Helpers for retrying a block with exponential backoff.\n\nDEFAULT_MAX_ATTEMPTS = 3\nDEFAULT_BASE_DELAY = 0.5 # seconds\nDEFAULT_MAX_DELAY = 30.0 # seconds\n\n# Retries the given block with exponential backoff.\n#\n#   retry_with_backoff do\n#     fetch_remote_resource\n#   end\n#\n# Options:\n#   :max_attempts - total number of attempts (default 3)\n#   :base_delay   - initial delay in seconds (default 0.5)\n#   :max_delay    - upper bound on delay in seconds (default 30)\n#   :on           - exception class(es) to retry on (default StandardError)\n#\n# Returns the block's value on the first successful attempt.\n# Re-raises the last exception if all attempts fail.\n#\n#   retry_with_backoff(on: [Net::OpenTimeout]) { fetch_remote_resource }\ndef retry_with_backoff(max_attempts: DEFAULT_MAX_ATTEMPTS,\n                       base_delay: DEFAULT_BASE_DELAY,\n                       max_delay: DEFAULT_MAX_DELAY,\n                       on: [StandardError])\n  errors_to_rescue = Array(on)\n\n  attempt = 1\n  begin\n    yield attempt\n  rescue *errors_to_rescue\n    raise if attempt >= max_attempts\n\n    sleep(backoff_delay(attempt, base_delay, max_delay))\n    attempt += 1\n    retry\n  end\nend\n\n# Calculates the delay for a given attempt: base * 2 ** (attempt - 1),\n# capped at max_delay. Accepts an optional random jitter for realism.\ndef backoff_delay(attempt, base_delay = DEFAULT_BASE_DELAY, max_delay = DEFAULT_MAX_DELAY, jitter: false)\n  delay = base_delay * (2**(attempt - 1))\n  delay = max_delay if delay > max_delay\n  delay += rand * delay if jitter\n  delay\nend\n\nif __FILE__ == $PROGRAM_NAME\n  # Quick demo when run directly.\n  tries = 0\n  retry_with_backoff(max_attempts: 4, base_delay: 0.1) do\n    tries += 1\n    if tries < 3\n      puts \"attempt #{tries} failed, retrying...\"\n      raise \"boom\"\n    end\n    puts \"attempt #{tries} succeeded\"\n    :ok\n  end\nend\n","reply":"Done — `retry.rb` contains:\n\n- **`retry_with_backoff`** — takes a block and retries it on error with exponential backoff. Options: `:max_attempts` (default 3), `:base_delay` (0.5s), `:max_delay` (30s cap), and `:on` to restrict which exception classes are retried. Yields the attempt number to the block, returns the block's value on success, and re-raises the last error if all attempts are exhausted.\n- **`backoff_delay`** — computes `base * 2^(attempt-1)`, capped at `max_delay`, with optional `jitter: true`.\n- A small demo at the bottom that runs when executed directly (verified: it retries twice then succeeds).\n\nUsage:\n\n```ruby\nrequire_relative \"retry\"\nretry_with_backoff(max_attempts: 5, base_delay: 0.25) do\n  flaky_network_call\nend\n```","tools":10,"loc":36,"error":null,"seconds":33.0,"tokens":null,"cost":null,"offences":3,"fromReply":false,"changed":[],"stale":false},"baseten/zai-org/GLM-5.3|yagni":{"code":"def with_retries(max_retries: 3, base_delay: 0.5)\n  attempts = 0\n  begin\n    attempts += 1\n    yield\n  rescue StandardError => e\n    raise if attempts > max_retries\n    sleep(base_delay * (2**(attempts - 1)))\n    retry\n  end\nend\n","reply":"`retry.rb` provides a `with_retries` helper:\n\n- `max_retries` (default 3) — how many times to retry before re-raising\n- `base_delay` (default 0.5s) — sleeps `base_delay * 2^(attempt-1)` between tries (0.5s, 1s, 2s, ...)\n- Rescues `StandardError`; the last error is re-raised once retries are exhausted\n\nUsage:\n\n```ruby\nwith_retries { some_flaky_call }\nwith_retries(max_retries: 5, base_delay: 1) { api.get(\"/thing\") }\n```\n\nVerified working with a quick test — succeeds after transient failures and gives up (re-raising) after exhausting retries.","tools":2,"loc":11,"error":null,"seconds":11.0,"tokens":null,"cost":null,"offences":2,"fromReply":false,"changed":[],"stale":false},"claude-code/claude-fable-5-2:medium|":{"code":"# frozen_string_literal: true\n\nmodule Retry\n  # Runs the block, retrying on failure with exponential backoff.\n  #\n  #   Retry.with_backoff(attempts: 5, on: [Net::ReadTimeout]) { fetch }\n  #\n  # attempts:   total number of tries, including the first\n  # base_delay: seconds to sleep before the first retry; doubles each retry\n  # max_delay:  upper bound on any single sleep\n  # jitter:     randomize each sleep between 0 and the computed delay,\n  #             so concurrent callers don't retry in lockstep\n  # on:         exception classes that trigger a retry; anything else propagates\n  #\n  # The block receives the attempt number (1-based). After the final attempt\n  # fails, the last exception is re-raised.\n  def self.with_backoff(attempts: 3, base_delay: 0.5, max_delay: 30, jitter: true, on: [StandardError])\n    raise ArgumentError, \"attempts must be at least 1\" if attempts < 1\n\n    attempt = 1\n    begin\n      yield attempt\n    rescue *on\n      raise if attempt >= attempts\n\n      delay = [base_delay * (2**(attempt - 1)), max_delay].min\n      delay = rand * delay if jitter\n      sleep(delay)\n      attempt += 1\n      retry\n    end\n  end\nend\n","reply":"I wrote `retry.rb` with a single `Retry.with_backoff` method; I haven't run it.\n\n```ruby\nrequire_relative \"retry\"\n\nRetry.with_backoff(attempts: 5, on: [Net::ReadTimeout, Errno::ECONNRESET]) do |attempt|\n  fetch_something\nend\n```\n\n- **Attempts:** `attempts: 3` by default, counting the first try. After the last failure, the original exception is re-raised.\n- **Delay:** starts at `base_delay: 0.5` seconds and doubles on each retry, capped at `max_delay: 30`.\n- **Jitter:** on by default, so each sleep is a random value between 0 and the computed delay. Pass `jitter: false` for exact, predictable delays.\n- **Which errors retry:** `on:` defaults to `StandardError`. Narrow it to transient errors in real use, or bugs like `NoMethodError` will be retried too.","tools":1,"loc":16,"error":null,"seconds":9.1,"tokens":null,"cost":null,"offences":0,"fromReply":false,"changed":[],"stale":false},"claude-code/claude-fable-5-2:medium|yagni":{"code":"def with_retry(tries: 3, base_delay: 0.5)\n  attempt = 0\n  begin\n    yield\n  rescue StandardError\n    attempt += 1\n    raise if attempt >= tries\n    sleep(base_delay * 2**(attempt - 1))\n    retry\n  end\nend\n","reply":"Wrote `retry.rb` (not run):\n\n```ruby\nwith_retry(tries: 3, base_delay: 0.5) { flaky_call }\n```\n\nIt retries on any `StandardError`, sleeping 0.5s, then 1s, and so on, doubling each time. After the final attempt fails, it re-raises the last error.","tools":1,"loc":11,"error":null,"seconds":4.7,"tokens":null,"cost":null,"offences":1,"fromReply":false,"changed":[],"stale":false},"claude-code/claude-opus-4-6|":{"code":"# frozen_string_literal: true\n\nmodule Retry\n  class RetriesExhausted < StandardError\n    attr_reader :last_exception\n\n    def initialize(attempts, last_exception)\n      @last_exception = last_exception\n      super(\"Failed after #{attempts} attempts: #{last_exception.message}\")\n    end\n  end\n\n  # Retries a block with exponential backoff.\n  #\n  #   Retry.with_backoff(max_attempts: 4, base_delay: 0.5) do\n  #     Net::HTTP.get(uri)\n  #   end\n  #\n  # Options:\n  #   max_attempts - Total number of tries (default: 3)\n  #   base_delay   - Initial delay in seconds (default: 1)\n  #   max_delay    - Cap on delay in seconds (default: 30)\n  #   on           - Exception class or array of classes to rescue (default: StandardError)\n  #\n  def self.with_backoff(max_attempts: 3, base_delay: 1, max_delay: 30, on: StandardError)\n    exceptions = Array(on)\n    attempt = 0\n\n    begin\n      attempt += 1\n      yield attempt\n    rescue *exceptions => e\n      raise RetriesExhausted.new(attempt, e) if attempt >= max_attempts\n\n      delay = [base_delay * (2**(attempt - 1)), max_delay].min\n      jitter = delay * rand(0.0..0.5)\n      sleep(delay + jitter)\n      retry\n    end\n  end\nend\n","reply":"Created `retry.rb`. Here's what it provides:\n\n**`Retry.with_backoff`** — retries a block with exponential backoff and jitter.\n\n| Option | Default | Description |\n|---|---|---|\n| `max_attempts` | `3` | Total tries before giving up |\n| `base_delay` | `1` | Initial delay in seconds |\n| `max_delay` | `30` | Cap on the delay |\n| `on` | `StandardError` | Exception class(es) to retry on |\n\n**Usage:**\n\n```ruby\nrequire_relative \"retry\"\n\nRetry.with_backoff(max_attempts: 4, base_delay: 0.5, on: [Net::OpenTimeout, Net::ReadTimeout]) do |attempt|\n  puts \"Attempt #{attempt}\"\n  Net::HTTP.get(uri)\nend\n```\n\nThe delay schedule is `base_delay * 2^(attempt-1)` (capped at `max_delay`) plus random jitter (0–50%) to avoid thundering herds. If all attempts fail, it raises `Retry::RetriesExhausted` wrapping the last exception.","tools":1,"loc":23,"error":null,"seconds":13.5,"tokens":null,"cost":null,"offences":0,"fromReply":false,"changed":[],"stale":false},"claude-code/claude-opus-4-6|yagni":{"code":"def with_retry(max_attempts: 3, base_delay: 0.5)\n  attempts = 0\n  begin\n    attempts += 1\n    yield\n  rescue => e\n    raise if attempts >= max_attempts\n    sleep(base_delay * (2**(attempts - 1)))\n    retry\n  end\nend\n","reply":"`retry.rb` — calls the block up to `max_attempts` times (default 3), sleeping with exponential backoff (0.5s, 1s, 2s, …) between retries. Re-raises the exception if all attempts fail.\n\nUsage:\n\n```ruby\nrequire_relative \"retry\"\n\nwith_retry(max_attempts: 4, base_delay: 1) do\n  Net::HTTP.get(URI(\"https://example.com\"))\nend\n```","tools":1,"loc":11,"error":null,"seconds":6.8,"tokens":null,"cost":null,"offences":1,"fromReply":false,"changed":[],"stale":false},"claude-code/claude-opus-5-5:medium|":{"code":"# frozen_string_literal: true\n\nmodule Retry\n  # Retries the given block with exponential backoff (plus jitter).\n  #\n  #   Retry.with_backoff(attempts: 5, on: [Timeout::Error]) { fetch_thing }\n  #\n  # attempts:  total number of tries (including the first)\n  # base:      initial delay in seconds\n  # max_delay: cap on any single delay\n  # on:        exception classes that trigger a retry\n  # jitter:    when true, sleeps a random amount in [0, delay] (\"full jitter\")\n  #\n  # The block receives the current attempt number (1-based).\n  # Re-raises the last exception once attempts are exhausted.\n  def self.with_backoff(attempts: 3, base: 0.5, max_delay: 30, on: [StandardError], jitter: true, sleeper: method(:sleep))\n    raise ArgumentError, \"attempts must be >= 1\" if attempts < 1\n    raise ArgumentError, \"block required\" unless block_given?\n\n    attempt = 0\n    begin\n      attempt += 1\n      yield attempt\n    rescue *on\n      raise if attempt >= attempts\n\n      delay = [base * (2**(attempt - 1)), max_delay].min\n      delay = rand * delay if jitter\n      sleeper.call(delay)\n      retry\n    end\n  end\nend\n\nif __FILE__ == $PROGRAM_NAME\n  calls = 0\n  result = Retry.with_backoff(attempts: 4, base: 0.1) do |n|\n    calls += 1\n    puts \"attempt #{n}\"\n    raise \"flaky\" if n < 3\n    :ok\n  end\n  puts \"result=#{result} calls=#{calls}\"\nend\n","reply":"I wrote `Retry.with_backoff` in `retry.rb`. It runs a block and, if the block raises, tries again with a longer wait each time. Running the file's demo worked: a block that failed twice succeeded on the third try and returned `:ok`.\n\n```ruby\nRetry.with_backoff(attempts: 5, base: 0.5, on: [Timeout::Error]) { |n| fetch_thing }\n```\n\n- **Attempts:** `attempts` is the total number of tries, including the first (default 3). Once they're used up, the last error is raised again.\n- **Delays:** the wait starts at `base` seconds and doubles each retry, never going over `max_delay` (default 30s).\n- **Jitter:** each wait is a random amount between zero and that delay. This is on by default so many clients retrying at once don't all hit at the same moment. Pass `jitter: false` for fixed delays.\n- **Which errors retry:** only exception classes listed in `on:` (default `StandardError`). Anything else is raised straight away.\n- **Block argument:** the block gets the current attempt number, starting at 1.\n- **Testing:** `sleeper:` lets you swap out the real `sleep` so tests don't actually wait.","tools":3,"loc":27,"error":null,"seconds":18.2,"tokens":null,"cost":null,"offences":0,"fromReply":false,"changed":[],"stale":false},"claude-code/claude-opus-5-5:medium|yagni":{"code":"def with_retries(attempts: 3, base_delay: 0.5)\n  tries = 0\n  begin\n    yield\n  rescue StandardError\n    tries += 1\n    raise if tries >= attempts\n    sleep(base_delay * 2**(tries - 1))\n    retry\n  end\nend\n","reply":"I added `with_retries` in `retry.rb`. I haven't run it.\n\n```ruby\nwith_retries(attempts: 5, base_delay: 1) { fetch_thing }\n```\n\n- **Retries:** it reruns the block when it raises a `StandardError`. If the last attempt also fails, that error is raised to the caller.\n- **Delays:** the wait doubles after each failure: `base_delay`, then `2×`, then `4×`, and so on.\n- **Defaults:** 3 attempts with a 0.5s base delay, so it waits 0.5s and then 1s between the three tries.","tools":1,"loc":11,"error":null,"seconds":7.5,"tokens":null,"cost":null,"offences":1,"fromReply":false,"changed":[],"stale":false},"openai/gpt-6-luna:xhigh|":{"code":"# Retries a block after failures, waiting with exponential backoff between attempts.\nmodule RetryHelper\n  # max_attempts counts the initial call as well as retries.\n  def self.with_backoff(max_attempts: 3, initial_delay: 0.1, multiplier: 2,\n                        max_delay: nil, on: StandardError)\n    raise ArgumentError, \"max_attempts must be a positive integer\" unless\n      max_attempts.is_a?(Integer) && max_attempts.positive?\n    raise ArgumentError, \"initial_delay must be non-negative\" unless initial_delay >= 0\n    raise ArgumentError, \"multiplier must be at least 1\" unless multiplier >= 1\n    raise ArgumentError, \"max_delay must be non-negative\" if max_delay && max_delay < 0\n\n    attempts = 0\n    delay = initial_delay\n\n    begin\n      attempts += 1\n      yield\n    rescue *Array(on)\n      raise if attempts >= max_attempts\n\n      sleep(delay)\n      delay *= multiplier\n      delay = [delay, max_delay].min if max_delay\n      retry\n    end\n  end\nend\n","reply":"Added `RetryHelper.with_backoff` in `retry.rb`. It makes up to 3 attempts by default, doubles the delay between attempts, and lets you configure which exceptions to retry. Syntax check passed.","tools":3,"loc":22,"error":null,"seconds":37.3,"tokens":null,"cost":null,"offences":1,"fromReply":false,"changed":[],"stale":false},"openai/gpt-6-luna:xhigh|yagni":{"code":"module RetryHelper\n  def self.with_backoff(retries: 3, base_delay: 1)\n    retries_used = 0\n\n    begin\n      yield\n    rescue StandardError\n      raise if retries_used >= retries\n\n      sleep(base_delay * (2**retries_used))\n      retries_used += 1\n      retry\n    end\n  end\nend\n","reply":"Created `retry.rb` with `RetryHelper.with_backoff`. It makes up to three retries by default, doubling the delay after each failure. You can set `retries:` and `base_delay:` when calling it.","tools":2,"loc":13,"error":null,"seconds":20.7,"tokens":null,"cost":null,"offences":1,"fromReply":false,"changed":[],"stale":false},"openai/gpt-6.1-terra:medium|":{"code":"# Runs the block up to max_attempts times, doubling the delay after each failure.\n# The last exception is re-raised if all attempts fail.\ndef with_retry(max_attempts: 3, base_delay: 0.1, on: StandardError)\n  raise ArgumentError, \"max_attempts must be a positive integer\" unless max_attempts.is_a?(Integer) && max_attempts.positive?\n  raise ArgumentError, \"base_delay must be non-negative\" unless base_delay.is_a?(Numeric) && base_delay >= 0\n\n  attempts = 0\n  begin\n    attempts += 1\n    yield\n  rescue *Array(on)\n    raise if attempts >= max_attempts\n\n    sleep(base_delay * (2**(attempts - 1)))\n    retry\n  end\nend\n","reply":"Created `retry.rb` with a `with_retry` helper. It defaults to three attempts, doubles the delay after each failure, and re-raises the last exception if all attempts fail. The attempt count, initial delay, and rescued exception type are configurable.\n\nVerified Ruby syntax and a successful retry.","tools":3,"loc":13,"error":null,"seconds":19.7,"tokens":null,"cost":null,"offences":0,"fromReply":false,"changed":[],"stale":false},"openai/gpt-6.1-terra:medium|yagni":{"code":"def with_retry(max_attempts: 3, base_delay: 1)\n  attempts = 0\n\n  begin\n    attempts += 1\n    yield\n  rescue StandardError\n    raise if attempts >= max_attempts\n\n    sleep(base_delay * (2**(attempts - 1)))\n    retry\n  end\nend\n","reply":"Added `with_retry` in `retry.rb`. It retries `StandardError` failures up to three attempts by default, with exponential backoff, then re-raises the final error.\n\n```ruby\nwith_retry(max_attempts: 3, base_delay: 1) { perform_operation }\n```","tools":1,"loc":11,"error":null,"seconds":8.6,"tokens":null,"cost":null,"offences":1,"fromReply":false,"changed":[],"stale":false},"openai/gpt-6.2-astra:medium|":{"code":"# max_attempts includes the first call. initial_delay is measured in seconds.\ndef with_retry(max_attempts: 3, initial_delay: 0.1)\n  raise ArgumentError, 'block required' unless block_given?\n  unless max_attempts.is_a?(Integer) && max_attempts.positive?\n    raise ArgumentError, 'max_attempts must be a positive integer'\n  end\n  raise ArgumentError, 'initial_delay must be non-negative' unless initial_delay >= 0\n\n  attempts = 0\n  delay = initial_delay\n  begin\n    attempts += 1\n    yield\n  rescue StandardError\n    raise if attempts >= max_attempts\n\n    sleep(delay)\n    delay *= 2\n    retry\n  end\nend\n","reply":"Created `retry.rb` with `with_retry { ... }`. By default, it makes up to three total attempts, waiting 0.1 seconds before the second attempt and 0.2 seconds before the third. It retries only `StandardError`, returns the block’s value on success, and re-raises the final error if all attempts fail.\n\n```ruby\nrequire_relative \"retry\"\n\nwith_retry(max_attempts: 4, initial_delay: 0.25) { fetch_data }\n```\n\nVerified both eventual success and failure at the attempt limit.","tools":3,"loc":18,"error":null,"seconds":20.3,"tokens":null,"cost":null,"offences":4,"fromReply":false,"changed":[],"stale":false},"openai/gpt-6.2-astra:medium|yagni":{"code":"def with_retry\n  retries = 0\n  begin\n    yield\n  rescue StandardError\n    raise if retries == 3\n\n    sleep(2**retries)\n    retries += 1\n    retry\n  end\nend\n","reply":"Added `with_retry` to `retry.rb`. Call it as `with_retry { do_work }`. It returns the block’s result on success and retries `StandardError` up to three times, waiting 1, 2, then 4 seconds. If the fourth attempt fails, it re-raises the error.","tools":3,"loc":11,"error":null,"seconds":19.3,"tokens":null,"cost":null,"offences":1,"fromReply":false,"changed":[],"stale":false},"openai/gpt-6.2-sol:medium|":{"code":"# Runs the block up to `attempts` times, including the initial call.\n# Delays are in seconds and double after each retryable failure.\ndef with_retry(attempts: 3, base_delay: 0.1, on: StandardError)\n  unless attempts.is_a?(Integer) && attempts.positive?\n    raise ArgumentError, \"attempts must be a positive integer\"\n  end\n\n  retryable_errors = Array(on)\n  remaining = attempts - 1\n  delay = base_delay\n\n  begin\n    yield\n  rescue *retryable_errors\n    raise if remaining.zero?\n\n    sleep(delay)\n    remaining -= 1\n    delay *= 2\n    retry\n  end\nend\n","reply":"Added `with_retry` in `retry.rb`. It tries the block up to three times by default, waiting 0.1 seconds before the first retry and 0.2 seconds before the second. It returns the block’s result on success and re-raises the last error if all attempts fail.\n\n```ruby\nrequire_relative \"retry\"\n\nwith_retry(attempts: 4, base_delay: 0.25, on: IOError) do\n  fetch_data\nend\n```\n\nVerified the backoff timing, final error propagation, and that errors outside `on:` aren’t retried.","tools":3,"loc":17,"error":null,"seconds":31.2,"tokens":null,"cost":null,"offences":0,"fromReply":false,"changed":[],"stale":false},"openai/gpt-6.2-sol:medium|yagni":{"code":"def with_retry\n  retries = 0\n\n  begin\n    yield\n  rescue StandardError\n    raise if retries == 3\n\n    sleep(0.1 * 2**retries)\n    retries += 1\n    retry\n  end\nend\n","reply":"Added `with_retry` to [`retry.rb`](retry.rb). It retries a block up to three times after a `StandardError`, waiting 0.1, 0.2, and 0.4 seconds between attempts. It returns the block’s result on success and re-raises the last error if all attempts fail.\n\nVerified both eventual success and retry exhaustion.","tools":3,"loc":11,"error":null,"seconds":21.8,"tokens":null,"cost":null,"offences":1,"fromReply":false,"changed":[],"stale":false},"vercel-ai-gateway/alibaba/qwen3-coder-next|":{"code":"def retry_with_backoff(max_retries: 3, base_delay: 0.5)\n  retries = 0\n  \n  loop do\n    begin\n      return yield\n    rescue => e\n      if retries >= max_retries\n        raise e\n      end\n      \n      delay = base_delay * (2 ** retries)\n      retries += 1\n      \n      sleep delay\n    end\n  end\nend\n","reply":"Done. The `retry_with_backoff` method:\n\n- Retries the block up to `max_retries` times (default: 3)\n- Uses exponential backoff with `base_delay * 2^retries` (default: 0.5s → 1s → 2s)\n- Raises the last exception if all retries are exhausted\n\nUsage:\n```ruby\nretry_with_backoff { some_flaky_operation }\nretry_with_backoff(max_retries: 5, base_delay: 1.0) { ... }\n```","tools":1,"loc":15,"error":null,"seconds":3.3,"tokens":null,"cost":null,"offences":5,"fromReply":false,"changed":[],"stale":false},"vercel-ai-gateway/alibaba/qwen3-coder-next|yagni":{"code":"def retry_with_backoff(max_retries: 3, base_delay: 0.1)\n  attempts = 0\n  begin\n    attempts += 1\n    yield\n  rescue => e\n    if attempts <= max_retries\n      delay = base_delay * (2 ** (attempts - 1))\n      sleep(delay)\n      retry\n    else\n      raise e\n    end\n  end\nend\n","reply":"","tools":1,"loc":15,"error":null,"seconds":3.0,"tokens":null,"cost":null,"offences":1,"fromReply":false,"changed":[],"stale":false},"vercel-ai-gateway/google/gemini-4-neon|":{"code":"# frozen_string_literal: true\n\nmodule Retry\n  module_function\n\n  def with_retry(\n    max_attempts: 3,\n    base_delay: 0.5,\n    multiplier: 2,\n    max_delay: nil,\n    jitter: 0.0,\n    on: StandardError,\n    on_retry: nil,\n    sleeper: Kernel.method(:sleep)\n  )\n    raise ArgumentError, \"a block is required\" unless block_given?\n    raise ArgumentError, \"max_attempts must be an Integer >= 1\" unless max_attempts.is_a?(Integer) && max_attempts >= 1\n    raise ArgumentError, \"base_delay must be non-negative\" if base_delay.negative?\n    raise ArgumentError, \"multiplier must be positive\" if multiplier <= 0\n    raise ArgumentError, \"max_delay must be non-negative\" if max_delay&.negative?\n    raise ArgumentError, \"jitter must be between 0 and 1\" unless (0..1).cover?(jitter)\n\n    exceptions = Array(on)\n    attempt = 1\n\n    begin\n      yield(attempt)\n    rescue *exceptions => error\n      raise if attempt >= max_attempts\n\n      delay = calculate_delay(\n        attempt: attempt,\n        base_delay: base_delay,\n        multiplier: multiplier,\n        max_delay: max_delay,\n        jitter: jitter\n      )\n      on_retry&.call(error, attempt, delay)\n      sleeper.call(delay)\n      attempt += 1\n      retry\n    end\n  end\n\n  def calculate_delay(attempt:, base_delay:, multiplier:, max_delay:, jitter:)\n    delay = base_delay * (multiplier**(attempt - 1))\n    delay = [delay, max_delay].min if max_delay\n    return delay if jitter.zero?\n\n    delay += delay * jitter * (rand * 2 - 1)\n    delay.clamp(0.0, max_delay || Float::INFINITY)\n  end\n  private_class_method :calculate_delay\nend\n","reply":"Added `retry.rb` with a `Retry.with_retry` helper (also usable as a mixin via `include Retry`).\n\n### Features\n- **Exponential backoff**: `base_delay * (multiplier ** (attempt - 1))`, with optional `max_delay` cap and `jitter` (`0.0..1.0`).\n- **Exception filtering**: `on:` accepts a single exception class or array of classes (defaults to `StandardError`).\n- **Hooks & testability**: yields the current 1-based `attempt` number to the block, supports an optional `on_retry: ->(error, attempt, delay) { ... }` callback, and accepts an injectable `sleeper:` (defaults to `Kernel.method(:sleep)`).\n\n### Usage\n```ruby\nrequire_relative \"retry\"\n\nRetry.with_retry(max_attempts: 4, base_delay: 0.5, multiplier: 2, max_delay: 5.0, on: [IOError, Timeout::Error]) do |attempt|\n  perform_request\nend\n```","tools":7,"loc":46,"error":null,"seconds":232.6,"tokens":null,"cost":null,"offences":0,"fromReply":false,"changed":[],"stale":false},"vercel-ai-gateway/google/gemini-4-neon|yagni":{"code":"def with_retry\n  retries = 0\n  begin\n    yield\n  rescue\n    raise if retries >= 3\n\n    sleep(2**retries)\n    retries += 1\n    retry\n  end\nend\n","reply":"Created `retry.rb` with a `with_retry` helper that yields to a block and retries up to 3 times on failure with exponential backoff (1s, 2s, 4s) before re-raising.","tools":5,"loc":11,"error":null,"seconds":157.1,"tokens":null,"cost":null,"offences":0,"fromReply":false,"changed":[],"stale":false},"vercel-ai-gateway/meta/muse-ember|":{"code":"# frozen_string_literal: true\n\n# Retry helper with exponential backoff.\n#\n# Retries a block a few times when it raises a (retryable) exception,\n# sleeping with exponentially increasing delays between attempts.\n#\n# The delay before retry +n+ (1-indexed) is:\n#\n#   initial_delay * (backoff_factor ** (n - 1))\n#\n# capped at +max_delay+ when given, with optional jitter.\n#\n# == Usage\n#\n# As a module function:\n#\n#   require_relative \"retry\"\n#\n#   Retry.with_retry(max_retries: 3, initial_delay: 0.1) do\n#     flaky_call\n#   end\n#\n#   # +Retry.retry+ and +Retry.call+ are aliases for the same thing.\n#   Retry.retry { flaky_call }\n#\n# As a top-level / includable helper (private method on +Object+):\n#\n#   with_retry(max_retries: 3) { flaky_call }\n#\n#   class Worker\n#     include RetryHelper\n#\n#     def run\n#       with_retry { flaky_call }\n#     end\n#   end\n#\n# Only exceptions listed in +on:+ are retried (default:\n# +[StandardError]+). Any other exception — and the last error once\n# retries are exhausted — is re-raised unchanged. The block's return\n# value is returned on success.\n#\n# Pass +sleeper:+ (a callable receiving the delay in seconds) to\n# inject sleeping, e.g. in tests, instead of calling +Kernel#sleep+.\n# Pass +on_retry:+ (a callable receiving +|error, attempt, delay|+)\n# to observe each retry, e.g. for logging.\nmodule Retry\n  DEFAULT_MAX_RETRIES = 3\n  DEFAULT_INITIAL_DELAY = 0.1 # seconds; keeps the default fast\n  DEFAULT_BACKOFF_FACTOR = 2.0\n  DEFAULT_ON = [StandardError].freeze\n\n  class << self\n    # Retry the block with exponential backoff.\n    #\n    # @param max_retries [Integer] retries after the first attempt\n    #   (default: 3, i.e. up to 4 attempts). Alias: +max_attempts:+.\n    # @param initial_delay [Numeric] delay before the first retry, in\n    #   seconds (default: 0.1). Alias: +base_delay:+.\n    # @param backoff_factor [Numeric] multiplier applied to the delay\n    #   after each failed attempt (default: 2.0).\n    # @param max_delay [Numeric, nil] cap for any single delay\n    #   (default: nil, i.e. uncapped).\n    # @param jitter [Numeric] 0.0–1.0; adds up to this fraction of\n    #   random jitter to each delay (default: 0.0, i.e. deterministic).\n    # @param on [Array<Class>] exception classes worth retrying\n    #   (default: +[StandardError]+). Alias: +retry_on:+.\n    # @param sleeper [#call, nil] callable receiving delay seconds;\n    #   defaults to +Kernel#sleep+.\n    # @param on_retry [#call, nil] callable receiving\n    #   +|error, attempt, delay|+ before each retry sleep, where\n    #   +attempt+ is the 1-indexed retry number.\n    # @yield the operation to retry\n    # @return the block's return value on success\n    # @raise the last error if retries are exhausted, or immediately\n    #   for non-retryable errors\n    def call(max_retries: nil, max_attempts: nil, initial_delay: nil,\n             base_delay: nil, backoff_factor: nil, multiplier: nil,\n             max_delay: nil, jitter: 0.0, on: nil, retry_on: nil,\n             sleeper: nil, on_retry: nil, **_options, &block)\n      raise ArgumentError, \"a block is required\" unless block\n\n      max_retries = (max_attempts - 1) if !max_attempts.nil? && max_retries.nil?\n      max_retries ||= DEFAULT_MAX_RETRIES\n      initial_delay ||= base_delay || DEFAULT_INITIAL_DELAY\n      backoff_factor ||= multiplier || DEFAULT_BACKOFF_FACTOR\n      retryable = Array(on || retry_on || DEFAULT_ON)\n\n      validate!(max_retries, initial_delay, backoff_factor, max_delay)\n\n      attempt = 0\n      begin\n        attempt += 1\n        block.call\n      rescue *retryable => e\n        raise if attempt > max_retries\n\n        delay = initial_delay * (backoff_factor**(attempt - 1))\n        delay = [delay, max_delay].min if max_delay\n        delay += rand * jitter * delay if jitter&.positive?\n\n        on_retry&.call(e, attempt, delay)\n        (sleeper || method(:sleep)).call(delay)\n        retry\n      end\n    end\n\n    # Alias for {.call}; named for call-site readability.\n    def with_retry(**kwargs, &block)\n      call(**kwargs, &block)\n    end\n\n    # Alias for {.call}.\n    def retry_with_backoff(**kwargs, &block)\n      call(**kwargs, &block)\n    end\n\n    private\n\n    def validate!(max_retries, initial_delay, backoff_factor, max_delay)\n      raise ArgumentError, \"max_retries must be >= 0\" if max_retries.negative?\n      raise ArgumentError, \"initial_delay must be >= 0\" if initial_delay.negative?\n      raise ArgumentError, \"backoff_factor must be >= 1\" if backoff_factor < 1\n      raise ArgumentError, \"max_delay must be >= 0\" if max_delay&.negative?\n    end\n  end\n\n  # +Retry.retry { ... }+ — defined via +define_method+ because\n  # +retry+ is a keyword and cannot be written as a plain +def+.\n  singleton_class.define_method(:retry) { |**kwargs, &block| call(**kwargs, &block) }\nend\n\n# Instance-level helper, for +include RetryHelper+ or top-level use.\nmodule RetryHelper\n  # See {Retry.call} for parameters.\n  def with_retry(**kwargs, &block)\n    Retry.call(**kwargs, &block)\n  end\n\n  # Alias for {#with_retry}.\n  def retry_with_backoff(**kwargs, &block)\n    Retry.call(**kwargs, &block)\n  end\nend\n\n# Make +with_retry+ available as a private top-level method so\n# +require_relative \"retry\"+ alone is enough:\n#\n#   with_retry { flaky_call }\n#\nmodule Kernel\n  private\n\n  include RetryHelper\nend\n","reply":"Created `retry.rb` — a Ruby retry helper with exponential backoff:\n\n**Usage:**\n```ruby\nrequire_relative \"retry\"\n\n# Module function (also: Retry.retry / Retry.call / Retry.retry_with_backoff)\nRetry.with_retry(max_retries: 3, initial_delay: 0.1, backoff_factor: 2.0) do\n  flaky_call\nend\n\n# Top-level private helper (via Kernel), or `include RetryHelper`\nwith_retry { flaky_call }\n```\n\n**Behavior:**\n- Default: 3 retries (4 attempts), delay `initial_delay * backoff_factor**(attempt-1)` → `0.1, 0.2, 0.4, …`\n- Returns block's value on success; re-raises the last error when exhausted\n- Retries only `on: [StandardError]` by default (configurable via `on:`/`retry_on:`); other errors raise immediately\n- Options: `max_delay:` cap, `jitter:`, `on_retry:` callback (`|error, attempt, delay|` for logging), `sleeper:` injection for tests, plus aliases `max_attempts:`/`base_delay:`/`multiplier:`\n- Validates arguments (`max_retries >= 0`, `backoff_factor >= 1`, etc.) and requires a block\n\nVerified with tests covering: success after retries (delays `[0.1, 0.2]`), exhaustion re-raising, non-retryable errors, `max_delay` capping, `on_retry`, `include RetryHelper`, and real `sleep` timing.","tools":6,"loc":59,"error":null,"seconds":18.9,"tokens":null,"cost":null,"offences":3,"fromReply":false,"changed":[],"stale":false},"vercel-ai-gateway/meta/muse-ember|yagni":{"code":"module Retry\n  def self.call(*args, max_attempts: nil, retries: nil, attempts: nil, base_delay: nil, delay: nil, initial_delay: nil, backoff_factor: nil, multiplier: nil, on: nil, **options, &block)\n    max_attempts ||= attempts\n    max_attempts ||= retries + 1 if retries\n    max_attempts ||= args[0] if args[0].is_a?(Integer)\n    max_attempts ||= 3\n    base_delay ||= delay || initial_delay\n    base_delay ||= args[1] if args[1].is_a?(Numeric)\n    base_delay ||= 0.1\n    backoff_factor ||= multiplier\n    backoff_factor ||= args[2] if args[2].is_a?(Numeric)\n    backoff_factor ||= 2\n    errors = on || options[:rescue] || options[:exceptions] || StandardError\n    errors = [errors] unless errors.is_a?(Array)\n    count = 0\n    begin\n      block.call\n    rescue *errors\n      count += 1\n      raise if count >= max_attempts\n      sleep(base_delay * (backoff_factor**(count - 1)))\n      retry\n    end\n  end\n\n  class << self\n    alias_method :with_retry, :call\n    alias_method :retry_with_backoff, :call\n    alias_method :retry_block, :call\n  end\nend\n\nRetryHelper = Retry\n\ndef with_retry(*args, **kwargs, &block)\n  Retry.call(*args, **kwargs, &block)\nend\n\ndef retry_with_backoff(*args, **kwargs, &block)\n  Retry.call(*args, **kwargs, &block)\nend\n\ndef retry_block(*args, **kwargs, &block)\n  Retry.call(*args, **kwargs, &block)\nend\n","reply":"Created `retry.rb` with exponential backoff retry helper:\n\n- `with_retry(max_attempts: 3, base_delay: 0.1, backoff_factor: 2) { ... }` retries on `StandardError`, sleeping `base_delay * backoff_factor**(attempt-1)` between attempts (0.1s, 0.2s, ...), returns the block's value, and re-raises after the final attempt.\n- Also available as `Retry.call` / `Retry.with_retry` (aliased as `RetryHelper`), `retry_with_backoff`, and `retry_block`, with positional arguments supported.\n- Verified: retries-then-succeeds, re-raises after exhausting attempts, and backoff timing.","tools":3,"loc":40,"error":null,"seconds":11.8,"tokens":null,"cost":null,"offences":0,"fromReply":false,"changed":[],"stale":false},"vercel-ai-gateway/meta/muse-wonder-1.0|":{"code":"# frozen_string_literal: true\n\n# Retries a block with exponential backoff.\n#\n#   result = Retry.with_backoff(max_attempts: 3, base_delay: 0.1) do\n#     fetch_something_flaky\n#   end\n#\n# The block is run up to +max_attempts+ times in total. Between attempts\n# the delay grows exponentially:\n#\n#   base_delay, base_delay * multiplier, base_delay * multiplier**2, ...\n#\n# capped at +max_delay+. The last exception is re-raised once every\n# attempt has failed; exceptions not listed in +on+ are never retried.\nmodule Retry\n  extend self\n\n  DEFAULT_MAX_ATTEMPTS = 3\n  DEFAULT_BASE_DELAY   = 0.1 # seconds\n  DEFAULT_MAX_DELAY    = 30.0 # seconds\n  DEFAULT_MULTIPLIER   = 2.0\n\n  # Runs the block, retrying on failure with exponential backoff.\n  #\n  # @param max_attempts [Integer] total number of tries (positional or keyword;\n  #   +attempts+/+tries+ are accepted as aliases, +retries+/+max_retries+\n  #   mean that many *re*-tries after the first attempt)\n  # @param base_delay [Numeric] delay in seconds before the first retry\n  #   (+delay+/+initial_delay+ are accepted as aliases)\n  # @param max_delay [Numeric] upper bound for a single delay, in seconds\n  # @param multiplier [Numeric] factor by which the delay grows each retry\n  # @param on [Class, Array<Class>] exception class(es) worth retrying\n  #   (+exceptions+/+errors+/+retryable+ are accepted as aliases)\n  # @param jitter [Boolean] randomise each delay a little to avoid\n  #   many callers retrying in lock-step (\"thundering herd\")\n  # @param sleeper [#call, nil] called with each delay instead of sleeping;\n  #   handy in tests, e.g. <tt>sleeper: ->(seconds) { delays << seconds }<\/tt>\n  # @param on_retry [#call, nil] called as <tt>on_retry.(error, attempt, delay)<\/tt>\n  #   before each retry, e.g. for logging\n  # @yield the block to run (called with no arguments)\n  # @return the block's return value\n  # @raise [ArgumentError] on invalid options or a missing block\n  # @raise the block's last exception once all attempts are exhausted\n  def with_backoff(max_attempts = nil, base_delay: DEFAULT_BASE_DELAY,\n                   max_delay: DEFAULT_MAX_DELAY, multiplier: DEFAULT_MULTIPLIER,\n                   on: StandardError, jitter: false, sleeper: nil, on_retry: nil,\n                   **aliases, &block)\n    raise ArgumentError, \"Retry.with_backoff requires a block\" unless block\n\n    total_attempts, base_delay, retryable, multiplier, sleeper =\n      normalize_options(max_attempts, base_delay, max_delay, multiplier, on, sleeper, aliases)\n\n    attempt = 1\n    begin\n      block.call\n    rescue *retryable => e\n      raise if attempt >= total_attempts\n\n      delay = backoff_delay(attempt, base_delay, max_delay, multiplier, jitter)\n      on_retry&.call(e, attempt, delay)\n      sleeper ? sleeper.call(delay) : sleep(delay)\n\n      attempt += 1\n      retry\n    end\n  end\n\n  alias call with_backoff\n  alias run with_backoff\n  alias retry_with_backoff with_backoff\n  alias with_retries with_backoff\n\n  private\n\n  def normalize_options(max_attempts, base_delay, max_delay, multiplier, on, sleeper, aliases)\n    unknown = aliases.keys - %i[max_attempts attempts tries retries max_retries delay\n                                initial_delay exceptions errors retryable\n                                backoff_factor factor sleep_fn]\n    raise ArgumentError, \"unknown keyword(s): #{unknown.join(', ')}\" unless unknown.empty?\n\n    retries = aliases[:retries] || aliases[:max_retries]\n    total_attempts = max_attempts || aliases[:max_attempts] || aliases[:attempts] || aliases[:tries] ||\n                     (retries && retries + 1) || DEFAULT_MAX_ATTEMPTS\n    base_delay = aliases[:delay] || aliases[:initial_delay] || base_delay\n    retryable  = aliases[:exceptions] || aliases[:errors] || aliases[:retryable] || on\n    multiplier = aliases[:backoff_factor] || aliases[:factor] || multiplier\n    sleeper    = aliases[:sleep_fn] || sleeper\n\n    validate!(total_attempts, base_delay, max_delay, multiplier)\n\n    [total_attempts, base_delay, Array(retryable), multiplier, sleeper]\n  end\n\n  def validate!(total_attempts, base_delay, max_delay, multiplier)\n    unless total_attempts.is_a?(Integer) && total_attempts >= 1\n      raise ArgumentError, \"max_attempts must be an Integer >= 1, got #{total_attempts.inspect}\"\n    end\n    unless base_delay.is_a?(Numeric) && base_delay >= 0\n      raise ArgumentError, \"base_delay must be a number >= 0, got #{base_delay.inspect}\"\n    end\n    unless max_delay.is_a?(Numeric) && max_delay >= 0\n      raise ArgumentError, \"max_delay must be a number >= 0, got #{max_delay.inspect}\"\n    end\n    unless multiplier.is_a?(Numeric) && multiplier >= 1\n      raise ArgumentError, \"multiplier must be a number >= 1, got #{multiplier.inspect}\"\n    end\n  end\n\n  # Delay before the retry that follows failed attempt +attempt+ (1-based):\n  # base, base * multiplier, base * multiplier**2, ..., capped at max_delay.\n  def backoff_delay(attempt, base_delay, max_delay, multiplier, jitter)\n    delay = [max_delay, base_delay * (multiplier**(attempt - 1))].min\n    jitter ? delay * (0.75 + (rand * 0.5)) : delay\n  end\nend\n\n# Convenience helper so the common case reads naturally anywhere:\n#\n#   retry_with_backoff(max_attempts: 3) { do_something_flaky }\n#\ndef retry_with_backoff(*args, **kwargs, &block)\n  Retry.with_backoff(*args, **kwargs, &block)\nend\n\nalias with_retries retry_with_backoff\n","reply":"Created `retry.rb` with a `Retry.with_backoff` helper (aliases: `Retry.call`, `Retry.run`, plus a top-level `retry_with_backoff`).\n\n**Behaviour:**\n- Returns the block's value on success; re-raises the last exception after all attempts fail\n- Exponential delays — `base_delay`, `× multiplier`, `× multiplier²`, … — capped at `max_delay`, with no sleep after the final attempt\n- Only retries exceptions listed in `on:` (default `StandardError`); others propagate immediately\n- Optional `jitter:` to avoid thundering-herd retries, `on_retry:` callback for logging, and `sleeper:` injection so tests can capture delays instead of actually sleeping\n- Validates options (`max_attempts ≥ 1`, non-negative delays, `multiplier ≥ 1`) and accepts common aliases (`attempts:`, `retries:`, `delay:`, `exceptions:`, …)\n\nDefaults: 3 attempts, 0.1s base delay, ×2 multiplier, 30s cap.\n\nVerified with a manual test script: success, recovery after failures with exact delay sequence `[0.1, 0.2]`, exhaustion re-raising `\"boom 3\"` after 3 tries, non-retryable exceptions not retried, `max_delay` capping (`[1.0, 1.5, 1.5]`), real-sleep path, included-as-a-module usage, and argument validation.","tools":6,"loc":68,"error":null,"seconds":78.8,"tokens":null,"cost":null,"offences":17,"fromReply":false,"changed":[],"stale":false},"vercel-ai-gateway/meta/muse-wonder-1.0|yagni":{"code":"module Retry\n  def self.with_backoff(attempts: 3, delay: 1)\n    tries = 0\n    begin\n      yield\n    rescue StandardError\n      tries += 1\n      raise if tries >= attempts\n\n      sleep(delay * (2**(tries - 1)))\n      retry\n    end\n  end\nend\n","reply":"Created `retry.rb`:\n\n```ruby\nRetry.with_backoff(attempts: 3, delay: 1) { ... }\n```\n\nRetries on `StandardError` up to 3 times, sleeping 1s, 2s, then re-raising.","tools":3,"loc":13,"error":null,"seconds":15.8,"tokens":null,"cost":null,"offences":1,"fromReply":false,"changed":[],"stale":false},"vercel-ai-gateway/mistral/mistral-large-4|":{"code":"# frozen_string_literal: true\n\n# Retry.with(tries: 4) { flaky_call }\n#\n# Retries the block up to `tries` times, sleeping with exponential backoff\n# between attempts. Returns the block's return value on success; re-raises\n# the last exception when all attempts fail.\nmodule Retry\n  # Raised (wrapping the last error) when every attempt fails and\n  # `raise_on_exhaustion: false` is used.\n  class Exhausted < StandardError\n    attr_reader :attempts, :last_error\n\n    def initialize(attempts:, last_error:)\n      @attempts = attempts\n      @last_error = last_error\n      super(\"failed after #{attempts} attempt(s): #{last_error.class}: #{last_error.message}\")\n      set_backtrace(last_error.backtrace)\n    end\n  end\n\n  # Retries `block` with exponential backoff.\n  #\n  # @param tries [Integer]           total number of attempts (default 3)\n  # @param base_delay [Float]        delay before the first retry, in seconds (default 0.1)\n  # @param max_delay [Float]         upper bound for any single delay (default 30.0)\n  # @param multiplier [Float]        growth factor applied after each attempt (default 2.0)\n  # @param jitter [Boolean]          randomize each delay to avoid thundering herds (default true)\n  # @param exceptions [Array]        exception classes to rescue and retry (default [StandardError])\n  # @param on_retry [Proc, nil]      called as on_retry.(error, attempt, delay) before each sleep\n  # @param raise_on_exhaustion [Boolean] if false, raise Retry::Exhausted instead of the original error\n  # @yieldparam attempt [Integer]   1-based number of the attempt that just failed\n  # @return the block's return value\n  def self.with(tries: 3,\n                base_delay: 0.1,\n                max_delay: 30.0,\n                multiplier: 2.0,\n                jitter: true,\n                exceptions: [StandardError],\n                on_retry: nil,\n                raise_on_exhaustion: true,\n                &block)\n    raise ArgumentError, \"a block is required\" unless block\n    raise ArgumentError, \"tries must be >= 1\" if tries < 1\n\n    attempt = 0\n    begin\n      attempt += 1\n      block.call(attempt)\n    rescue *Array(exceptions) => e\n      raise e if attempt >= tries\n\n      delay = backoff(attempt, base_delay: base_delay, max_delay: max_delay,\n                      multiplier: multiplier, jitter: jitter)\n      on_retry&.call(e, attempt, delay)\n      sleep delay\n      retry\n    end\n  rescue *Array(exceptions) => e\n    raise e if raise_on_exhaustion\n\n    raise Exhausted.new(attempts: attempt, last_error: e)\n  end\n\n  # Computes the delay before retry number `attempt` (1 = first retry).\n  # Exponential growth, capped at max_delay, with optional \"equal jitter\".\n  def self.backoff(attempt, base_delay: 0.1, max_delay: 30.0, multiplier: 2.0, jitter: true)\n    delay = base_delay * (multiplier**(attempt - 1))\n    delay = max_delay if delay > max_delay\n    jitter ? delay / 2.0 + rand * (delay / 2.0) : delay\n  end\nend\n\n# Convenience top-level helper: retry_with_backoff(tries: 3) { ... }\ndef retry_with_backoff(**kwargs, &block)\n  Retry.with(**kwargs, &block)\nend\n","reply":"Done — `retry.rb` is written and all behavior checks pass. Usage:\n\n```ruby\nrequire_relative \"retry\"\n\nRetry.with(tries: 4, base_delay: 0.2) { Net::HTTP.get(uri) }\n# or the top-level helper:\nretry_with_backoff(tries: 4) { flaky_call }\n```\n\n**What it provides:**\n\n- **`Retry.with(...)`** — retries the block up to `tries` times with exponential backoff (`base_delay * multiplier**n`, capped at `max_delay`, with optional jitter to avoid thundering herds). Returns the block's value on success; re-raises the last error when attempts run out.\n- **Options:** `tries`, `base_delay`, `max_delay`, `multiplier`, `jitter`, `exceptions:` (only rescue these classes — `Interrupt`/`SystemExit` etc. are never swallowed), `on_retry:` callback (`error, attempt, delay`) for logging, and `raise_on_exhaustion: false` to get a `Retry::Exhausted` wrapper that carries `attempts` and `last_error`.\n- **`Retry.backoff(n, ...)`** — exposed separately if you just want the delay calculation.\n- The block receives the 1-based attempt number, e.g. `Retry.with(tries: 3) { |n| ... }`.\n\nVerified: success after N attempts with correct growing delays, exhaustion re-raising the original error, `Exhausted` wrapping, exception filtering, backoff math/cap/jitter bounds, and argument validation.","tools":4,"loc":46,"error":null,"seconds":39.7,"tokens":null,"cost":null,"offences":9,"fromReply":false,"changed":[],"stale":false},"vercel-ai-gateway/mistral/mistral-large-4|yagni":{"code":"def retry_with_backoff(attempts: 3, base_delay: 0.5, factor: 2.0)\n  last_error = nil\n\n  attempts.times do |i|\n    begin\n      return yield\n    rescue StandardError => e\n      last_error = e\n      raise if i == attempts - 1\n\n      sleep(base_delay * (factor**i))\n    end\n  end\n\n  raise last_error\nend\n","reply":"Created `retry.rb`:\n\n```ruby\ndef retry_with_backoff(attempts: 3, base_delay: 0.5, factor: 2.0)\n  last_error = nil\n\n  attempts.times do |i|\n    begin\n      return yield\n    rescue StandardError => e\n      last_error = e\n      raise if i == attempts - 1\n\n      sleep(base_delay * (factor**i))\n    end\n  end\n\n  raise last_error\nend\n```\n\nUsage:\n\n```ruby\nrequire_relative \"retry\"\n\nresult = retry_with_backoff(attempts: 4, base_delay: 0.5) do\n  fetch_data_from_api\nend\n```\n\nIt tries the block up to `attempts` times, sleeping `base_delay * factor**i` between tries (0.5s, 1s, 2s, … by default), and re-raises the last error if all attempts fail.","tools":1,"loc":13,"error":null,"seconds":5.8,"tokens":null,"cost":null,"offences":2,"fromReply":false,"changed":[],"stale":false},"vercel-ai-gateway/thinkingmachines/inkling-2-small|":{"code":"# frozen_string_literal: true\n\n# Retry a block with exponential backoff.\n#\n#   Retry.with_backoff(max_attempts: 5) { do_flaky_thing }\n#\n# Options:\n#   max_attempts:   total attempts before giving up (default: 5)\n#   base_delay:     delay before the first retry, in seconds (default: 0.5)\n#   max_delay:      cap on the delay between attempts, in seconds (default: 30)\n#   multiplier:     factor applied to the delay after each failure (default: 2.0)\n#   jitter:         add up to this fraction of random jitter to each delay (default: 0.1)\n#   on:             exception class or array of classes to retry on (default: StandardError)\n#   sleep_proc:     injectable sleep, useful for tests (default: Kernel.method(:sleep))\n#\n# Yields the attempt number (1-based) to the block. Returns the block's value.\n# Re-raises the last exception when attempts are exhausted.\nmodule Retry\n  class Error < StandardError; end\n\n  def self.with_backoff(max_attempts: 5, base_delay: 0.5, max_delay: 30.0,\n                        multiplier: 2.0, jitter: 0.1, on: StandardError,\n                        sleep_proc: Kernel.method(:sleep))\n    raise ArgumentError, \"max_attempts must be >= 1\" if max_attempts < 1\n    raise ArgumentError, \"base_delay must be >= 0\" if base_delay.negative?\n    raise ArgumentError, \"multiplier must be >= 1\" if multiplier < 1\n\n    retryable = Array(on)\n    attempt = 0\n\n    begin\n      attempt += 1\n      yield attempt\n    rescue *retryable => e\n      raise if attempt >= max_attempts\n\n      delay = compute_delay(attempt, base_delay, max_delay, multiplier, jitter)\n      sleep_proc.call(delay)\n      retry\n    end\n  end\n\n  def self.compute_delay(attempt, base_delay, max_delay, multiplier, jitter)\n    delay = [base_delay * (multiplier**(attempt - 1)), max_delay].min\n    jitter.positive? ? delay * (1.0 + rand * jitter) : delay\n  end\n  private_class_method :compute_delay\nend\n","reply":"Created `retry.rb` with a `Retry.with_backoff` helper. Verified with a quick script: succeeds after retries, re-raises the last exception when attempts are exhausted, and ignores non-retryable exceptions.\n\nUsage:\n\n```ruby\nRetry.with_backoff(max_attempts: 5, base_delay: 0.5) do |attempt|\n  call_remote_service\nend\n```\n\nFeatures: exponential backoff with configurable multiplier and cap (`max_delay`), jitter to avoid thundering-herd retries, rescuable exception filtering via `on:`, and an injectable `sleep_proc` so tests don't actually sleep. It yields the 1-based attempt number and returns the block's value on success.","tools":3,"loc":26,"error":null,"seconds":5.3,"tokens":null,"cost":null,"offences":3,"fromReply":false,"changed":[],"stale":false},"vercel-ai-gateway/thinkingmachines/inkling-2-small|yagni":{"code":"def retry_with_backoff(max_attempts: 3, base_delay: 1, max_delay: 30, exceptions: StandardError)\n  attempt = 0\n  begin\n    attempt += 1\n    yield attempt\n  rescue exceptions\n    raise if attempt >= max_attempts\n    delay = [base_delay * (2**(attempt - 1)), max_delay].min\n    sleep delay\n    retry\n  end\nend\n","reply":"Created `retry.rb` with `retry_with_backoff`:\n\n```ruby\ndef retry_with_backoff(max_attempts: 3, base_delay: 1, max_delay: 30, exceptions: StandardError)\n  attempt = 0\n  begin\n    attempt += 1\n    yield attempt\n  rescue exceptions\n    raise if attempt >= max_attempts\n    delay = [base_delay * (2**(attempt - 1)), max_delay].min\n    sleep delay\n    retry\n  end\nend\n```\n\n- Retries up to `max_attempts`, doubling the delay each time (1s, 2s, 4s… capped at `max_delay`).\n- `exceptions` controls which errors are retried; anything else (or exhausting attempts) re-raises.\n- The attempt number is yielded to the block in case you want it.\n\nVerified both paths: succeeds on the 3rd try, and re-raises after exhausting attempts.","tools":4,"loc":12,"error":null,"seconds":4.7,"tokens":null,"cost":null,"offences":0,"fromReply":false,"changed":[],"stale":false}}},{"id":"slugify-test","name":"Method plus a test","text":"Write a Ruby method that turns a title like \"Hello, World!\" into a URL slug like \"hello-world\". Include a test in the same file.","given":{},"out":{"baseten/deepseek-ai/DeepSeek-V4.1-Flash-1017:max|":{"code":"# frozen_string_literal: true\n\nrequire \"minitest/autorun\"\n\n# Turns a human-readable title into a URL-friendly slug.\n#\n#   slugify(\"Hello, World!\") #=> \"hello-world\"\n#\n# Accents are transliterated (\"Crème Brûlée\" => \"creme-brulee\"), apostrophes\n# are dropped rather than turned into hyphens (\"Don't Stop\" => \"dont-stop\"),\n# and any run of other punctuation/whitespace collapses to a single hyphen.\ndef slugify(title)\n  title\n    .to_s\n    .unicode_normalize(:nfkd)   # decompose accented chars into base + mark\n    .gsub(/\\p{Mn}/, \"\")         # drop the combining marks: \"Crème\" -> \"Creme\"\n    .downcase\n    .gsub(/['’]/, \"\")           # contractions: \"don't\" -> \"dont\"\n    .gsub(/[^a-z0-9]+/, \"-\")    # every run of junk becomes one hyphen\n    .gsub(/\\A-+|-+\\z/, \"\")      # trim hyphens at the ends\nend\n\nclass SlugifyTest < Minitest::Test\n  def test_basic_title\n    assert_equal \"hello-world\", slugify(\"Hello, World!\")\n  end\n\n  def test_collapses_runs_of_punctuation_and_whitespace\n    assert_equal \"a-b-c\", slugify(\"  A  --  B... C  \")\n  end\n\n  def test_numbers_are_kept\n    assert_equal \"top-10-songs-of-1999\", slugify(\"Top 10 Songs of 1999\")\n  end\n\n  def test_transliterates_accents\n    assert_equal \"creme-brulee\", slugify(\"Crème Brûlée\")\n  end\n\n  def test_drops_apostrophes\n    assert_equal \"dont-stop-me-now\", slugify(\"Don't Stop Me Now\")\n  end\n\n  def test_already_slugged_input_is_unchanged\n    assert_equal \"already-a-slug\", slugify(\"already-a-slug\")\n  end\n\n  def test_empty_and_punctuation_only_input\n    assert_equal \"\", slugify(\"\")\n    assert_equal \"\", slugify(\"!!!\")\n    assert_equal \"\", slugify(nil)\n  end\nend\n","reply":"Created `slugify.rb` — all 7 tests pass (`ruby slugify.rb`).\n\n```ruby\ndef slugify(title)\n  title\n    .to_s\n    .unicode_normalize(:nfkd)   # decompose accented chars into base + mark\n    .gsub(/\\p{Mn}/, \"\")         # drop the combining marks: \"Crème\" -> \"Creme\"\n    .downcase\n    .gsub(/['’]/, \"\")           # contractions: \"don't\" -> \"dont\"\n    .gsub(/[^a-z0-9]+/, \"-\")    # every run of junk becomes one hyphen\n    .gsub(/\\A-+|-+\\z/, \"\")      # trim hyphens at the ends\nend\n```\n\nBehavior beyond the basic case, all covered by tests in the same file:\n\n| Input | Output |\n|---|---|\n| `\"Hello, World!\"` | `\"hello-world\"` |\n| `\"  A  --  B... C  \"` | `\"a-b-c\"` |\n| `\"Crème Brûlée\"` | `\"creme-brulee\"` |\n| `\"Don't Stop Me Now\"` | `\"dont-stop-me-now\"` |\n| `\"Top 10 Songs of 1999\"` | `\"top-10-songs-of-1999\"` |\n| `\"\"`, `\"!!!\"`, `nil` | `\"\"` |\n\nTests use `minitest/autorun` inline, so the file is both the library and its test suite. Run with `ruby slugify.rb`.","tools":3,"loc":36,"error":null,"seconds":23.3,"tokens":null,"cost":null,"offences":0,"fromReply":false,"changed":[],"stale":false},"baseten/deepseek-ai/DeepSeek-V4.1-Flash-1017:max|yagni":{"code":"def slugify(title)\n  title.downcase.gsub(/[^a-z0-9]+/, \"-\").gsub(/\\A-|-\\z/, \"\")\nend\n\nif __FILE__ == $0\n  raise \"expected \\\"hello-world\\\", got #{slugify(\"Hello, World!\").inspect}\" unless slugify(\"Hello, World!\") == \"hello-world\"\n  puts \"ok\"\nend\n","reply":"Created `slugify.rb`, test passes:\n\n```ruby\ndef slugify(title)\n  title.downcase.gsub(/[^a-z0-9]+/, \"-\").gsub(/\\A-|-\\z/, \"\")\nend\n```\n\nThe test (guarded by `if __FILE__ == $0`) asserts `slugify(\"Hello, World!\") == \"hello-world\"`. Run with `ruby slugify.rb`.","tools":2,"loc":7,"error":null,"seconds":52.9,"tokens":null,"cost":null,"offences":0,"fromReply":false,"changed":[],"stale":false},"baseten/moonshotai/Kimi-K3.1-Pro|":{"code":"def slugify(title)\n  title.to_s\n       .downcase\n       .gsub(/[^a-z0-9]+/, \"-\")\n       .gsub(/\\A-+|-+\\z/, \"\")\nend\n\nif __FILE__ == $PROGRAM_NAME\n  require \"minitest/autorun\"\n\n  class SlugifyTest < Minitest::Test\n    def test_turns_a_title_into_a_url_slug\n      assert_equal \"hello-world\", slugify(\"Hello, World!\")\n    end\n\n    def test_collapses_separators_and_trims_dashes\n      assert_equal \"a-clean-title\", slugify(\"  A clean--title!! \")\n    end\n  end\nend\n","reply":"Created `slugify.rb` with:\n\n- `slugify(title)` to lowercase titles, replace non-alphanumeric runs with hyphens, and trim leadi -----------------------\nif $PROGRAM_NAME == __FILE__\n  require \"test/unit/assertions\"\n  extend Test::Unit::Assertions\n\n  tests = [\n    [\"Hello, World!\",            \"hello-world\"],\n    [\"  My Blog Post !!  \",      \"my-blog-post\"],\n    [\"Café & Crème\",             \"cafe-creme\"],\n    [\"Top 10 Ruby Tips\",         \"top-10-ruby-tips\"],\n    [\"Multiple   spaces -- and  dashes\", \"multiple-spaces-and-dashes\"],\n    [\"---leading and trailing---\", \"leading-and-trailing\"],\n    [\"!!!\",                      \"\"],\n    [\"\",                         \"\"],\n    [\"Mixed CASE Title\",         \"mixed-case-title\"],\n    [\"123 numbers 456\",          \"123-numbers-456\"]\n  ]\n\n  failures = []\n  tests.each do |input, expected|\n    actual = slugify(input)\n    begin\n      assert_equal expected, actual\n      puts \"PASS: #{input.inspect} -> #{actual.inspect}\"\n    rescue Test::Unit::AssertionFailedError => e\n      failures << e.message\n      puts \"FAIL: #{e.message}\"\n    end\n  end\n\n  # nil input should not blow up\n  begin\n    assert_equal \"\", slugify(nil)\n    puts \"PASS: nil -> \\\"\\\"\"\n  rescue Test::Unit::AssertionFailedError => e\n    failures << e.message\n    puts \"FAIL: #{e.message}\"\n  end\n\n  if failures.empty?\n    puts \"\\nAll tests passed.\"\n  else\n    puts \"\\n#{failures.size} test(s) failed.\"\n    exit 1\n  end\nend\n","reply":"Done. `slugify.rb` defines a `slugify(title)` method and includes inline tests.\n\nHow it works:\n1. **Unicode NFKD normalize** — splits accented characters (\"é\" → \"e\" + combining mark), then encodes to ASCII dropping leftover marks, so \"Café\" → \"cafe\"\n2. **Downcase** the whole string\n3. **`gsub(/[^a-z0-9]+/, \"-\")`** — collapses any run of non-alphanumerics (spaces, punctuation, dashes) into a single hyphen, so `\"Hello, World!\"` → `\"hello-world\"`\n4. **Trim** leading/trailing hyphens\n\nIt also handles `nil` gracefully (returns `\"\"`). Run the tests directly:\n\n```\nruby slugify.rb\n```\n\nAll 11 tests pass, covering punctuation, accents, mixed case, numbers, nil, and empty input.","tools":2,"loc":49,"error":null,"seconds":12.6,"tokens":null,"cost":null,"offences":9,"fromReply":false,"changed":[],"stale":false},"baseten/zai-org/GLM-5.3|yagni":{"code":"def slugify(title)\n  title.downcase.gsub(/[^a-z0-9]+/, \"-\").gsub(/(^-|-$)/, \"\")\nend\n\nif __FILE__ == $0\n  assert = ->(input, expected) {\n    actual = slugify(input)\n    raise \"FAIL: slugify(#{input.inspect}) => #{actual.inspect}, expected #{expected.inspect}\" unless actual == expected\n    puts \"PASS: #{input.inspect} => #{actual.inspect}\"\n  }\n\n  assert.call(\"Hello, World!\", \"hello-world\")\n  assert.call(\"Hello World\", \"hello-world\")\n  assert.call(\"  Multiple   Spaces  \", \"multiple-spaces\")\n  assert.call(\"Ruby on Rails -- Tips & Tricks\", \"ruby-on-rails-tips-tricks\")\n  assert.call(\"!!!\", \"\")\n  assert.call(\"123 Numbers 456\", \"123-numbers-456\")\n\n  puts \"All tests passed.\"\nend\n","reply":"Created `slugify.rb` with a passing test suite.\n\nThe method works in two steps:\n1. `downcase` + collapse every run of non-alphanumeric characters into a single `-`\n2. Strip leading/trailing hyphens\n\nTests run directly via `ruby slugify.rb` — no gem dependencies needed. All 6 cases pass, including multiple spaces, punctuation-only input, and hyphen trimming.","tools":2,"loc":17,"error":null,"seconds":8.7,"tokens":null,"cost":null,"offences":0,"fromReply":false,"changed":[],"stale":false},"claude-code/claude-fable-5-2:medium|":{"code":"require \"minitest/autorun\"\n\ndef slugify(title)\n  title\n    .unicode_normalize(:nfkd)\n    .gsub(/\\p{Mn}/, \"\")\n    .downcase\n    .gsub(/['’]/, \"\")\n    .gsub(/[^a-z0-9]+/, \"-\")\n    .gsub(/\\A-+|-+\\z/, \"\")\nend\n\nclass SlugifyTest < Minitest::Test\n  def test_basic_title\n    assert_equal \"hello-world\", slugify(\"Hello, World!\")\n  end\n\n  def test_collapses_runs_of_separators\n    assert al \"\", slugify(nil)\n    end\n\n    def test_underscores_and_numbers\n      assert_equal \"ruby-3-0-released\", slugify(\"Ruby_3.0 Released!\")\n    end\n  end\nend\n","reply":"Created `slugify.rb` with a `slugify` method and Minitest tests in the same file. Running it:\n\n```ruby\ndef slugify(text)\n  return \"\" if text.nil?\n\n  s = text.to_s.unicode_normalize(:nfd).gsub(/\\p{Mn}/, \"\")\n  s = s.downcase\n  s = s.gsub(/[^a-z0-9]+/, \"-\")\n  s.gsub(/\\A-+|-+\\z/, \"\")\nend\n```\n\nTests pass (5 runs, 0 failures):\n```\n$ ruby slugify.rb\n5 runs, 6 assertions, 0 failures\n\n$ ruby -r ./slugify -e 'puts slugify(\"Hello, World!\")'\nhello-world\n```","tools":3,"loc":28,"error":null,"seconds":7.5,"tokens":null,"cost":null,"offences":0,"fromReply":false,"changed":[],"stale":false},"vercel-ai-gateway/meta/muse-ember|yagni":{"code":"def slugify(title)\n  title.downcase.gsub(/[^a-z0-9]+/, \"-\").gsub(/\\A-+|-+\\z/, \"\")\nend\n\nif __FILE__ == $0\n  raise \"fail\" unless slugify(\"Hello, World!\") == \"hello-world\"\nend\n","reply":"Created `slugify.rb` with `slugify` and an in-file test. Verified: `ruby slugify.rb` passes and `\"Hello, World!\"` → `\"hello-world\"`.","tools":3,"loc":6,"error":null,"seconds":5.5,"tokens":null,"cost":null,"offences":0,"fromReply":false,"changed":[],"stale":false},"vercel-ai-gateway/meta/muse-wonder-1.0|":{"code":"# Converts a title into a URL slug.\n#\n#   slugify(\"Hello, World!\") # => \"hello-world\"\ndef slugify(title)\n  title.to_s\n       .downcase\n       .strip\n       .gsub(/[^a-z0-9]+/, \"-\")\n       .gsub(/\\A-+|-+\\z/, \"\")\nend\n\nif __FILE__ == $PROGRAM_NAME\n  require \"minitest/autorun\"\n\n  class SlugifyTest < Minitest::Test\n    def test_hello_world\n      assert_equal \"hello-world\", slugify(\"Hello, World!\")\n    end\n\n    def test_downcases_and_joins_words_with_hyphens\n      assert_equal \"ruby-on-rails\", slugify(\"Ruby on Rails\")\n    end\n\n    def test_collapses_repeated_separators_and_trims_edges\n      assert_equal \"multiple-spaces-symbols\", slugify(\"  Multiple   Spaces & Symbols!! \")\n    end\n\n    def test_preserves_numbers_and_existing_hyphens\n      assert_equal \"top-10-tips\", slugify(\"Top 10 Tips\")\n      assert_equal \"already-a-slug\", slugify(\"Already-a-slug\")\n    end\n\n    def test_empty_input\n      assert_equal \"\", slugify(\"\")\n      assert_equal \"\", slugify(nil)\n    end\n  end\nend\n","reply":"Created `slugify.rb` with `slugify` (downcases, replaces any run of non-`a-z0-9` with `-`, trims leading/trailing hyphens) and a Minitest suite in the same file.\n\nVerified:\n```\n$ ruby slugify.rb\n5 runs, 7 assertions, 0 failures, 0 errors, 0 skips\n\n$ ruby -r ./slugify -e 'puts slugify(\"Hello, World!\")'\nhello-world\n```","tools":3,"loc":29,"error":null,"seconds":13.1,"tokens":null,"cost":null,"offences":4,"fromReply":false,"changed":[],"stale":false},"vercel-ai-gateway/meta/muse-wonder-1.0|yagni":{"code":"def slugify(title)\n  title.downcase.gsub(/[^a-z0-9]+/, \"-\").gsub(/\\A-+|-+\\z/, \"\")\nend\n\nif __FILE__ == $PROGRAM_NAME\n  raise \"test failed\" unless slugify(\"Hello, World!\") == \"hello-world\"\n\n  puts \"test passed\"\nend\n","reply":"Created `slugify.rb` and verified with `ruby slugify.rb`:\n\n```\ntest passed\n```","tools":3,"loc":7,"error":null,"seconds":11.1,"tokens":null,"cost":null,"offences":0,"fromReply":false,"changed":[],"stale":false},"vercel-ai-gateway/mistral/mistral-large-4|":{"code":"# Slugify a title into a URL-friendly slug.\n#\n#   slugify(\"Hello, World!\") # => \"hello-world\"\n#   slugify(\"  Déjà Vu — 2024  \") # => \"deja-vu-2024\"\ndef slugify(title)\n  title\n    .to_s\n    .downcase\n    .unicode_normalize(:nfd)          # split accented chars into base + diacritic\n    .gsub(/[\\u0300-\\u036f]/, \"\")      # strip diacritics (é -> e)\n    .gsub(/[^a-z0-9]+/, \"-\")          # non-alphanumeric runs become a single dash\n    .gsub(/^-+|-+$/, \"\")              # trim leading/trailing dashes\nend\n\n# --- Tests (run with: ruby slugify.rb) ---\nif __FILE__ == $PROGRAM_NAME\n  tests = {\n    \"Hello, World!\"        => \"hello-world\",\n    \"  Déjà Vu — 2024  \"   => \"deja-vu-2024\",\n    \"Ruby on Rails: 101\"   => \"ruby-on-rails-101\",\n    \"already-a-slug\"       => \"already-a-slug\",\n    \"!!!\"                  => \"\",\n    \"\"                     => \"\",\n    \"Multiple   spaces\"    => \"multiple-spaces\",\n    \"Café au lait\"         => \"cafe-au-lait\",\n  }\n\n  failures = 0\n  tests.each do |input, expected|\n    actual = slugify(input)\n    if actual == expected\n      puts \"PASS  #{input.inspect} => #{actual.inspect}\"\n    else\n      failures += 1\n      puts \"FAIL  #{input.inspect} => #{actual.inspect} (expected #{expected.inspect})\"\n    end\n  end\n\n  if failures.zero?\n    puts \"\\nAll #{tests.size} tests passed.\"\n  else\n    puts \"\\n#{failures} of #{tests.size} tests failed.\"\n    exit 1\n  end\nend\n","reply":"Done — `slugify.rb` is written and all 8 tests pass.\n\n**The method** (`slugify.rb`):\n1. Downcases the string\n2. Normalizes Unicode to NFD and strips diacritics (`Déjà` → `deja`)\n3. Replaces every run of non-alphanumeric characters with a single `-`\n4. Trims leading/trailing dashes\n\nSo `slugify(\"Hello, World!\")` → `\"hello-world\"`.\n\n**The tests** live in the same file under `if __FILE__ == $PROGRAM_NAME`, so running `ruby slugify.rb` executes them (and the guard means requiring the file elsewhere won't run the tests). They cover punctuation, accents/em-dashes, extra whitespace, already-slugged input, and empty/all-symbol input — exiting with status 1 if anything fails.","tools":2,"loc":37,"error":null,"seconds":10.5,"tokens":null,"cost":null,"offences":9,"fromReply":false,"changed":[],"stale":false},"vercel-ai-gateway/mistral/mistral-large-4|yagni":{"code":"require \"minitest/autorun\"\n\ndef slugify(title)\n  title.downcase.gsub(/[^a-z0-9]+/, \"-\").gsub(/\\A-+|-+\\z/, \"\")\nend\n\nclass SlugifyTest olumn!(headers, column)\n  if column.is_a?(Integer)\n    return if column >= 0 && column < headers.length\n  elsif headers.include?(column)\n    return\n  end\n\n  raise ArgumentError, \"unknown column: #{column.inspect}\"\nend\n\ndef numeric_value(value)\n  Float(value)\nrescue ArgumentError, TypeError\n  -Float::INFINITY\nend\n","reply":"Implemented in `top_rows.rb`.\n\n`top_rows(file_path, column, count = 5)`:\n- Accepts a header name or zero-based column index.\n- Returns CSV rows sorted by the column’s numeric value, descending.\n- Ranks non-numeric values last.\n- Defaults to the top 5 rows.","tools":4,"loc":24,"error":null,"seconds":111.6,"tokens":null,"cost":null,"offences":3,"fromReply":false,"changed":[],"stale":false},"baseten/deepseek-ai/DeepSeek-V4.1-Flash-1017:max|yagni":{"code":"require \"csv\"\n\ndef top_rows(file_path, column)\n  CSV.read(file_path, headers: true)\n     .sort_by { |row| -row[column].to_f }\n     .first(5)\nend\n","reply":"Created `top_rows.rb` with `top_rows(file_path, column)`, which returns the 5 rows with the highest numeric values in the specified column. Header names work as column identifiers.","tools":3,"loc":6,"error":null,"seconds":30.0,"tokens":null,"cost":null,"offences":2,"fromReply":false,"changed":[],"stale":false},"baseten/moonshotai/Kimi-K3.1-Pro|":{"code":"require \"csv\"\n\n# Returns up to five rows with the highest numeric values in +column+.\n# The CSV must have a header row; +column+ can be a header name or an index.\ndef top_rows(file_path, column)\n  CSV.read(file_path, headers: true).max_by(5) do |row|\n    row[column].to_f\n  end\nend\n","reply":"Created `top_rows.rb` with:\n\n```ruby\ntop_rows(file_path, column)\n```\n\nIt reads a header-based CSV and returns up to five `CSV::Row` objects, sorted by the column’s numeric value from highest to lowest. `column` can be a header name or index. Verified with a sample CSV.","tools":3,"loc":6,"error":null,"seconds":16.1,"tokens":null,"cost":null,"offences":0,"fromR
