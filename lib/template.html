<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stylebench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --table: #E4E9ED;
  --frame: #FFFFFF;
  --ink: #1E2A33;
  --muted: #687884;
  --rule: #C5CED5;
  --str: #2E6A50;
  --const: #2A5986;
  --rail: 248px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  width: max-content; min-width: 100%;
  background: var(--table);
  color: var(--ink);
  font: 15px/1.45 "Schibsted Grotesk", system-ui, sans-serif;
}
button, input { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--const); outline-offset: 2px; }

.bar {
  position: sticky; top: 0; left: 0; z-index: 20;
  width: 100vw;
  display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px 20px;
  padding: 12px 20px;
  background: var(--ink); color: #fff;
  padding-right: 84px;
}
.bar-top, .bar-panel { display: contents; }
.filter-toggle { display: none; }
.corner { position: absolute; top: 0; right: 0; line-height: 0; }
.corner svg { fill: #fff; }
.corner .arm, .corner .body { fill: var(--ink); }
.corner .arm { transform-origin: 130px 106px; }
@media (prefers-reduced-motion: no-preference) {
  .corner:hover .arm { animation: wave 560ms ease-in-out; }
}
@keyframes wave { 0%, 100% { transform: rotate(0); } 20%, 60% { transform: rotate(-25deg); } 40%, 80% { transform: rotate(10deg); } }
.bar h1 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.bar h1 a { text-decoration: none; }
.bar .spacer { flex: 1; }
.bar label { font-size: 14px; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }

.filters { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; align-items: baseline; flex: 1 1 600px; }
.filters .label { font-size: 13px; color: #A9B6C0; white-space: nowrap; }
.cols { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.chip, .all {
  border: 1px solid #4A5966; background: none; border-radius: 999px;
  padding: 2px 10px; font-size: 13px; cursor: pointer;
}
.all { border-radius: 6px; color: #C9D3DA; }
.chip[aria-pressed="true"] { background: #33424E; border-color: #7D8E9B; }
.chip[aria-pressed="false"] { opacity: .5; text-decoration: line-through; }

.sheet {
  display: grid;
  grid-template-columns: var(--rail) repeat(var(--n), max-content);
  gap: 14px;
  padding: 18px 20px 60px;
}
.row, .cards { display: contents; }
.who {
  display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  padding: 7px 12px;
  border-bottom: 1px solid var(--rule);
  background: #F3F6F8;
}
.model { font-weight: 700; font-size: 14px; overflow-wrap: anywhere; }
.pos { display: none; margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
.variant {
  font-size: 13px; padding: 0 7px; border-radius: 4px;
  background: var(--frame); border: 1px solid var(--rule);
  text-decoration: none;
}
.variant:hover { border-color: var(--const); color: var(--const); }

.prompt { align-self: start; padding: 10px 14px 10px 0; font-size: 14px; position: sticky; left: 20px; z-index: 5; background: var(--table); box-shadow: -20px 0 var(--table); }
.prompt .name { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
.prompt p { margin: 0 0 6px; color: #3B4954; }
.prompt pre { font: 12px/1.45 "IBM Plex Mono", monospace; background: #D6DDE2; padding: 6px 8px; border-radius: 4px; margin: 6px 0 0; white-space: pre-wrap; }

.frame {
  background: var(--frame);
  border: 1px solid var(--rule);
  border-radius: 3px;
  display: flex; flex-direction: column;
  font: 12.5px/1.55 "IBM Plex Mono", ui-monospace, monospace;
  width: calc(82ch + 26px);
  align-self: start;
}
.frame > :not(pre) { font-family: "Schibsted Grotesk", system-ui, sans-serif; line-height: 1.45; }
.prose {
  border-bottom: 1px dashed var(--rule);
  font-size: 13px; color: var(--muted);
  padding: 6px 12px;
}
.prose summary { cursor: pointer; }
.prose[open] { color: var(--ink); }
.prose p { margin: 6px 0 2px; }

pre.code {
  margin: 0; padding: 10px 0; font: inherit;
  max-height: calc(1.55em * 32 + 20px); overflow-y: auto;
  background:
    linear-gradient(var(--frame) 30%, rgba(255,255,255,0)) center top / 100% 24px no-repeat local,
    linear-gradient(rgba(255,255,255,0), var(--frame) 70%) center bottom / 100% 24px no-repeat local,
    radial-gradient(farthest-side at 50% 0, rgba(30,42,51,.14), transparent) center top / 100% 8px no-repeat scroll,
    radial-gradient(farthest-side at 50% 100%, rgba(30,42,51,.14), transparent) center bottom / 100% 8px no-repeat scroll;
}
pre.code::-webkit-scrollbar, .prose .md::-webkit-scrollbar { width: 10px; }
pre.code::-webkit-scrollbar-thumb, .prose .md::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 5px; border: 2px solid var(--frame); }
.ln { display: block; padding: 0 12px 0 calc(12px + 2ch); white-space: pre; min-height: 1.55em; position: relative; }
.ln.wrap::before { content: "\21AA"; position: absolute; left: 12px; color: #9AA7B1; }
.c { color: var(--muted); font-style: italic; }
.k { font-weight: 600; }
.s { color: var(--str); }
.y, .t, .n { color: var(--const); }

.loc {
  display: flex; flex-wrap: wrap; gap: 2px 14px;
  border-top: 1px solid var(--rule);
  padding: 6px 12px; font-size: 12.5px; color: var(--muted);
}
.loc b { color: var(--ink); font-weight: 600; }

.blind .model, .blind .variant { filter: blur(6px); user-select: none; pointer-events: none; }

.page { max-width: 72ch; padding: 28px 20px 60px; }
.page .back { font-size: 14px; color: var(--muted); }
.page h2 { font: 600 24px/1.2 "IBM Plex Mono", monospace; margin: 14px 0 6px; }
.page .used { color: var(--muted); margin: 0 0 18px; }
.page pre {
  background: var(--frame); border: 1px solid var(--rule); border-radius: 3px;
  padding: 16px 18px; font: 13.5px/1.6 "IBM Plex Mono", monospace; white-space: pre-wrap; margin: 0;
}

@media (max-width: 820px) {
  body { width: 100%; min-width: 0; overflow-x: clip; }
  .bar { width: 100%; display: block; padding: 0; }
  .bar-top {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 60px 10px 16px;
    min-height: 48px;
  }
  .filter-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid #5A6B78; background: #2B3944; border-radius: 6px;
    padding: 4px 10px; font-size: 13px; cursor: pointer;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .bar.open .filter-toggle { background: #fff; color: var(--ink); border-color: #fff; }
  .bar-panel {
    display: none;
    padding: 12px 16px 16px;
    border-top: 1px solid #33424E;
    max-height: calc(100dvh - 50px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .bar.open .bar-panel { display: block; }
  .filters { grid-template-columns: 1fr; gap: 6px; flex: none; }
  .filters .label:not(:first-child) { margin-top: 8px; }
  .chip, .all { padding: 5px 10px; font-size: 13px; max-width: 100%; overflow-wrap: anywhere; text-align: left; }
  .blind-toggle { margin-top: 14px; padding-top: 12px; border-top: 1px solid #33424E; display: flex; width: 100%; }
  .corner svg { width: 48px; height: 48px; }
  .sheet { display: flex; flex-direction: column; gap: 22px; padding: 14px 0 48px; }
  .row { display: block; border-bottom: 1px solid var(--rule); padding-bottom: 20px; }
  .row:last-child { border-bottom: 0; padding-bottom: 0; }
  .prompt { position: static; box-shadow: none; background: transparent; padding: 0 16px 10px; }
  .prompt .name { font-size: 16px; }
  .cards {
    display: flex; align-items: flex-start; gap: 12px;
    overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: 16px;
    padding: 0 16px 8px; -webkit-overflow-scrolling: touch;
  }
  .frame {
    flex: 0 0 min(calc(100vw - 44px), calc(82ch + 26px));
    width: min(calc(100vw - 44px), calc(82ch + 26px));
    scroll-snap-align: start;
    font-size: 11.5px;
  }
  .frame:only-child {
    flex: 0 0 min(calc(100vw - 32px), calc(82ch + 26px));
    width: min(calc(100vw - 32px), calc(82ch + 26px));
  }
  .who { padding: 7px 10px; }
  .pos { display: inline; }
  pre.code { max-height: min(54dvh, calc(1.55em * 24 + 20px)); overflow-x: hidden; }
  .ln { padding: 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .loc { gap: 2px 10px; font-size: 12px; padding: 6px 10px; }
  .page { padding: 20px 16px 48px; }
  .page pre { overflow-wrap: anywhere; }
}

.ln.changed { background: #FFF3C4; box-shadow: inset 3px 0 #D9A400; }
.note { padding: 6px 12px; font-size: 12.5px; color: #8A5A00; background: #FFF8E1; border-bottom: 1px solid var(--rule); }
.note.err { color: #9B1C1C; background: #FDECEC; }
.empty { padding: 14px 12px; color: var(--muted); font-size: 13px; }
.prompt .given { font-size: 12px; color: var(--muted); margin-top: 8px; }
.prose .md { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; margin: 6px 0 2px; max-height: 24em; overflow-y: auto; }
</style>
</head>
<body>
<header class="bar" id="bar">
  <div class="bar-top">
    <h1><a href="#">Stylebench</a></h1>
    <button class="filter-toggle" id="filter-toggle" type="button" aria-expanded="false" aria-controls="bar-panel">Filters</button>
  </div>
  <div class="bar-panel" id="bar-panel">
    <div class="filters">
      <span class="label">Models</span><div class="cols" id="f-models" aria-label="Models"></div>
      <span class="label">Variants</span><div class="cols" id="f-variants" aria-label="Variants"></div>
      <span class="label">Prompts</span><div class="cols" id="f-prompts" aria-label="Prompts"></div>
    </div>
    <label class="blind-toggle"><input type="checkbox" id="blind"> Hide model names</label>
  </div>
  <a class="corner" id="repo" hidden aria-label="Fork me on GitHub">
    <svg width="72" height="72" viewBox="0 0 250 250" aria-hidden="true">
      <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"/>
      <path class="arm" d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2"/>
      <path class="body" d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z"/>
    </svg>
  </a>
</header>
<main id="main"></main>
<script>
const data = /*DATA*/null;
const { columns, variants, prompts } = data;
if (data.repo) Object.assign(document.getElementById("repo"), { href: data.repo, hidden: false });

const KW = "def|end|class|module|if|elsif|else|unless|while|until|return|yield|do|begin|rescue|ensure|raise|then|case|when|self|nil|true|false|attr_reader|attr_accessor|attr_writer|private|require|require_relative|include|extend|freeze|retry|in|and|or|not|super|loop|next|break";
const TOKEN = new RegExp(`(#.*$)|("(?:[^"\\\\]|\\\\.)*"|'(?:[^'\\\\]|\\\\.)*'|\\/(?:[^/\\\\\\n ]|\\\\.)+\\/)|(:[a-z_]\\w*[?!]?|\\b[a-z_]\\w*:(?!:))|\\b(${KW})\\b|(\\b[A-Z]\\w*)|(\\b\\d[\\d_.]*)`, "g");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const WIDTH = 80;

function tokens(line) {
  const out = [];
  let last = 0;
  line.replace(TOKEN, (m, c, s, y, k, t, n, i) => {
    if (i > last) out.push(["", line.slice(last, i)]);
    out.push([c ? "c" : s ? "s" : y ? "y" : k ? "k" : t ? "t" : "n", m]);
    last = i + m.length;
  });
  if (last < line.length) out.push(["", line.slice(last)]);
  return out;
}

function breaks(line) {
  const cuts = [];
  let start = 0;
  while (line.length - start > WIDTH) {
    const space = line.lastIndexOf(" ", start + WIDTH - 1);
    const cut = space > start && line.slice(start, space).trim() ? space + 1 : start + WIDTH;
    cuts.push(cut);
    start = cut;
  }
  return cuts;
}

const mobile = matchMedia("(max-width: 820px)");

function rows(line) {
  const cuts = mobile.matches ? [] : breaks(line);
  const out = [""];
  let pos = 0;
  for (let [cls, text] of tokens(line)) {
    while (text) {
      const room = (cuts[out.length - 1] ?? Infinity) - pos;
      const piece = text.slice(0, room);
      out[out.length - 1] += cls ? `<span class="${cls}">${esc(piece)}</span>` : esc(piece);
      pos += piece.length;
      text = text.slice(room);
      if (text) out.push("");
    }
  }
  return out;
}

const NO_VARIANT = "";
const groups = {
  models: [...new Set(columns.map(c => c.key))].map(k => ({ id: k, label: columns.find(c => c.key === k).model })),
  variants: [...new Set(columns.map(c => c.variant ?? NO_VARIANT))].map(v => ({ id: v, label: v || "No variant" })),
  prompts: prompts.map(p => ({ id: p.id, label: p.name })),
};
const NONE = "none";
const query = new URLSearchParams(location.search);
const state = {
  hidden: Object.fromEntries(Object.entries(groups).map(([g, items]) => {
    if (!query.has(g)) return [g, new Set()];
    const shown = new Set(query.get(g).split(",").filter(Boolean).map(v => v === NONE ? NO_VARIANT : v));
    return [g, new Set(items.map(i => i.id).filter(id => !shown.has(id)))];
  })),
  blind: false,
};
function save() {
  const parts = Object.entries(groups).filter(([g]) => state.hidden[g].size).map(([g, items]) => {
    const shown = items.map(i => i.id).filter(id => !state.hidden[g].has(id));
    return g + "=" + shown.map(id => encodeURIComponent(id || NONE).replace(/%2F/g, "/").replace(/%3A/g, ":")).join(",");
  });
  history.replaceState(null, "", location.pathname + (parts.length ? "?" + parts.join("&") : "") + location.hash);
}
const visibleCols = () => columns.filter(c => !state.hidden.models.has(c.key) && !state.hidden.variants.has(c.variant ?? NO_VARIANT));
const visiblePrompts = () => prompts.filter(p => !state.hidden.prompts.has(p.id));
const variantLink = v => v ? `<a class="variant" href="#variant/${encodeURIComponent(v)}">${esc(v)}</a>` : "";
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

function frame(p, col, index, total) {
  const who = `<div class="who"><span class="model">${esc(col.model)}</span>${variantLink(col.variant)}<span class="pos">${index + 1} / ${total}</span></div>`;
  const o = p.out[col.id];
  if (!o) return `<article class="frame">${who}<div class="empty">Not run yet</div></article>`;
  const changed = new Set(o.changed);
  const code = o.code.replace(/\n$/, "");
  const lines = code.split("\n").map((l, i) => rows(l).map((html, r) =>
    `<span class="ln${r ? " wrap" : ""}${changed.has(i) ? " changed" : ""}">${html}</span>`).join("")).join("");
  const replyLines = o.reply ? o.reply.split("\n").filter(l => l.trim()).length : 0;
  const prose = replyLines
    ? `<details class="prose"><summary>Plus ${plural(replyLines, "line")} of prose</summary><div class="md">${esc(o.reply)}</div></details>`
    : "";
  const notes = [
    o.error && `<div class="note err">${esc(o.error)}</div>`,
    o.fromReply && !o.error && `<div class="note">Didn't write the file; code taken from its reply</div>`,
    o.stale && `<div class="note">Prompt or variant changed since this ran</div>`,
  ].filter(Boolean).join("");
  return `<article class="frame">${who}${notes}${prose}${code ? `<pre class="code">${lines}</pre>` : ""}<div class="loc"><span><b>${o.loc}</b> LOC</span><span><b>${o.tools}</b> ${o.tools === 1 ? "tool call" : "tool calls"}</span><span><b>${o.seconds}</b>s</span>${o.tokens ? `<span><b>${o.tokens.input.toLocaleString()}</b> in / <b>${(o.tokens.cached ?? 0).toLocaleString()}</b> cached / <b>${o.tokens.output.toLocaleString()}</b> out tokens</span>` : ""}${o.expect ? `<span><b>${o.hits}/${o.expect}</b> expected idioms</span>` : ""}<span><b>${o.offences}</b> Standard ${o.offences === 1 ? "offence" : "offences"}</span></div></article>`;
}

function promptCell(p) {
  const given = Object.keys(p.given);
  return `<div class="prompt"><div class="name">${esc(p.name)}</div><p>${esc(p.text)}</p>${given.length ? `<div class="given">Starts with ${given.map(esc).join(", ")}</div>` : ""}</div>`;
}

function renderSheet() {
  const cols = visibleCols();
  const shown = visiblePrompts();
  if (!cols.length || !shown.length) return `<div class="page"><p>Nothing to show. Pick at least one model, variant, and prompt in the top bar.</p></div>`;
  const rows = shown.map(p => `<section class="row">${promptCell(p)}<div class="cards">${cols.map((c, i) => frame(p, c, i, cols.length)).join("")}</div></section>`).join("");
  return `<div class="sheet" style="--n:${cols.length}">${rows}</div>`;
}

function renderVariant(name) {
  const used = [...new Set(columns.filter(c => c.variant === name).map(c => c.model))];
  return `<div class="page">
    <a class="back" href="#">Back to results</a>
    <h2>${esc(name)}</h2>
    <p class="used">${used.length ? `Appended to the system prompt for ${used.map(esc).join(", ")}.` : "Not used in any run yet."}</p>
    <pre>${esc(variants[name] ?? "This variant file no longer exists.")}</pre>
  </div>`;
}

function render() {
  document.body.classList.toggle("blind", state.blind);
  const m = location.hash.match(/^#variant\/(.+)$/);
  document.getElementById("main").innerHTML = m ? renderVariant(decodeURIComponent(m[1])) : renderSheet();
  for (const [group, items] of Object.entries(groups)) {
    document.getElementById("f-" + group).innerHTML =
      `<button class="all" data-group="${group}" data-all="1">All</button><button class="all" data-group="${group}" data-all="0">None</button>` +
      items.map((item, i) => {
        const label = state.blind && group === "models" ? `Model ${i + 1}` : item.label.replace("claude-", "");
        return `<button class="chip" data-group="${group}" data-id="${esc(item.id)}" aria-pressed="${!state.hidden[group].has(item.id)}">${esc(label)}</button>`;
      }).join("");
  }
  const toggle = document.getElementById("filter-toggle");
  const filtered = Object.values(state.hidden).some(s => s.size);
  toggle.textContent = filtered ? `Filters (${plural(visibleCols().length, "col")}, ${plural(visiblePrompts().length, "prompt")})` : "Filters";
}

const bar = document.getElementById("bar");
const filterToggle = document.getElementById("filter-toggle");
function setFiltersOpen(open) {
  bar.classList.toggle("open", open);
  filterToggle.setAttribute("aria-expanded", String(open));
}
filterToggle.onclick = () => setFiltersOpen(!bar.classList.contains("open"));

document.addEventListener("click", e => {
  if (bar.classList.contains("open") && !e.target.closest("#bar")) setFiltersOpen(false);
  const all = e.target.closest(".all");
  if (all) {
    const g = all.dataset.group;
    state.hidden[g] = all.dataset.all === "1" ? new Set() : new Set(groups[g].map(i => i.id));
    save();
    return render();
  }
  const chip = e.target.closest(".chip");
  if (chip) {
    const hidden = state.hidden[chip.dataset.group];
    const id = chip.dataset.id;
    hidden.has(id) ? hidden.delete(id) : hidden.add(id);
    save();
    render();
  }
});
document.getElementById("blind").onchange = e => { state.blind = e.target.checked; render(); };
mobile.addEventListener("change", render);
window.addEventListener("hashchange", () => { setFiltersOpen(false); render(); scrollTo(0, 0); });
render();
</script>
</body>
</html>
